<link rel="manifest" href="/manifest.json">

<meta name="mobile-web-app-capable" content="yes">

<body>

<header class="barra">
  <div class="envoltura fila entre">
    <a class="marca" href="#/inicio">
      <svg class="glifo" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="50" fill="#2D3A47"/>
        <g fill="none" stroke="#B46A72" stroke-width="2.6" stroke-linecap="round" opacity=".85">
          <line x1="25" y1="25" x2="45" y2="45"/>
          <line x1="45" y1="45" x2="75" y2="78"/>
        </g>
        <circle cx="25" cy="25" r="5" fill="#FFF7E6"/>
        <circle cx="45" cy="45" r="7" fill="#FFF7E6"/>
        <circle cx="75" cy="78" r="11" fill="#FFF7E6"/>
      </svg>
      <span class="nombre">MÍA</span>
    </a>
    <div class="menu-cabecera">
      <button id="btn_menu_cabecera" class="btn-menu-cabecera" type="button" aria-haspopup="true"
        aria-expanded="false" aria-label="Menú" onclick="alternarMenuCabecera()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="7" x2="20" y2="7"></line>
          <line x1="4" y1="12" x2="20" y2="12"></line>
          <line x1="4" y1="17" x2="20" y2="17"></line>
        </svg>
      </button>
      <div id="menu_cabecera" class="desplegable-cabecera" role="menu" hidden></div>
    </div>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="envoltura pila g8">
    <strong style="color:var(--texto)">MÍA</strong>
    <span>Directorio y comunidad de negocios dirigidos por mujeres.</span>
    <nav class="fila g12" style="flex-wrap:wrap">
      <a href="#/app">App</a>
      <a href="#/sobre">Sobre MÍA</a>
      <a href="#/privacidad">Aviso de privacidad</a>
    </nav>
  </div>
</footer>

<nav class="tabs" id="tabs"></nav>

<div id="toast" role="status" aria-live="polite"></div>

<script src="/js/app.js"></script>
