name: Compilar app de Android

on:
  workflow_dispatch:
  push:
    branches:
      - claude/plataforma-negocios-mujeres-tdem5s
    paths:
      - 'movil/**'

jobs:
  compilar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias de Capacitor
        run: npm install

      - name: Sincronizar proyecto de Android
        run: npx cap sync android

      - name: Compilar APK de prueba (debug)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Compilar paquete para Play Store (release, sin firmar)
        run: cd android && ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: mia-android-debug-apk
          path: movil/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mia-android-release-aab-sin-firmar
          path: movil/android/app/build/outputs/bundle/release/app-release.aab
