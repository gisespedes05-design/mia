let D = cargar();

function cargar(){
  const crudo = leerCrudo();
  if(!crudo) { const d = semilla(); escribirCrudo(JSON.stringify(d)); return d; }
  try {
    const d = JSON.parse(crudo);
    if(!d || !Array.isArray(d.usuarios)) throw new Error("corrupto");
    return d;
  } catch { const d = semilla(); escribirCrudo(JSON.stringify(d)); return d; }
}
function guardar(){ return escribirCrudo(JSON.stringify(D)); }

function reiniciar(){
  if(!confirm("Esto borra todo lo que hayas capturado y deja MÍA como recién instalada. ¿Continuamos?")) return;
  D = semilla(); guardar(); location.hash = "#/directorio"; pintar();
  avisar("Listo, MÍA quedó como nueva.");
}

/* ================================================================ UTILIDAD */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const $ = id => document.getElementById(id);
const val = id => ($(id) ? $(id).value.trim() : "");

function avisar(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("ver");
  clearTimeout(avisar._t); avisar._t = setTimeout(() => t.classList.remove("ver"), 3200);
}

const pesos = n => (n === null || n === undefined || n === "") ? ""
  : "$" + Number(n).toLocaleString("es-MX", {minimumFractionDigits:0, maximumFractionDigits:2});

function fecha(iso){
  if(!iso) return "";
  const d = new Date(iso + (iso.length === 10 ? "T12:00:00" : ""));
  if(isNaN(d)) return iso;
  return d.toLocaleDateString("es-MX", {day:"numeric", month:"long", year:"numeric"});
}

function slugificar(txt){
  const base = String(txt).normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60) || "negocio";
  let s = base, n = 2;
  while(D.negocios.some(x => x.slug === s)) s = base + "-" + (n++);
  return s;
}

function anotar(accion, detalle){

/* ============================================================== MEMBRESÍA */
/** Reglas que le tocan a un negocio hoy. Si venció, cae a las del plan gratuito. */
function reglas(n){
  const contratado = PLANES[n.plan] ? n.plan : "gratis";
  const vencida = contratado !== "gratis" && n.vence
    && new Date(n.vence + "T23:59:59") < new Date();
  const efectivo = vencida ? "gratis" : contratado;
  return {
    contratado, efectivo, vencida,
    limites: PLANES[efectivo].limites,
    permisos: PLANES[efectivo].permisos
  };
}

/** Lo que el público alcanza a ver: aquí se recorta todo lo que exceda el plan. */
function publico(n){
  const r = reglas(n);
  return {
    fotos: (n.fotos || []).slice(0, r.limites.fotos),
    descripcion: (n.descripcion || "").slice(0, r.limites.descripcion),
    whatsapp: r.permisos.whatsapp ? n.whatsapp : "",
    sitio: r.permisos.sitioWeb ? n.sitio : "",
    redes: r.permisos.redes
      ? {instagram:n.instagram, facebook:n.facebook, tiktok:n.tiktok}
      : {instagram:"", facebook:"", tiktok:""},
    productos: r.permisos.catalogo ? (n.productos || []).slice(0, r.limites.productos) : [],
    verificado: n.verificado && r.permisos.insignia,
    destacado: n.destacado && r.permisos.prioridad,
    reglas: r
  };
}

/** Avisos para la dueña sobre lo que su plan le está ocultando. */
function bloqueos(n){
  const r = reglas(n), L = [];
  if(r.vencida) L.push("Tu membresía " + PLANES[r.contratado].nombre + " venció el " +
    fecha(n.vence) + ". Mientras tanto MÍA aplica las reglas del plan gratuito. Nada se borró: al renovar vuelve a aparecer todo.");
  const fotos = (n.fotos || []).length;
  if(fotos > r.limites.fotos)
    L.push((fotos - r.limites.fotos) + " de tus " + fotos + " fotografías no se muestran. Tu plan permite " + r.limites.fotos + ".");
  const prods = (n.productos || []).length;
  if(prods && !r.permisos.catalogo)
    L.push("Tu catálogo de " + prods + " producto(s) está oculto. El catálogo empieza en el plan Emprende.");
  else if(prods > r.limites.productos)
    L.push((prods - r.limites.productos) + " producto(s) no se muestran. Tu plan permite " + r.limites.productos + ".");
  if(n.whatsapp && !r.permisos.whatsapp) L.push("Tu botón de WhatsApp está oculto. Empieza en el plan Emprende.");
  if(n.sitio && !r.permisos.sitioWeb) L.push("Tu sitio web está oculto. Empieza en el plan Emprende.");
  if((n.instagram || n.facebook || n.tiktok) && !r.permisos.redes)
    L.push("Tus redes sociales están ocultas. Empiezan en el plan Emprende.");
  if((n.descripcion || "").length > r.limites.descripcion)
    L.push("Tu descripción se muestra recortada a " + r.limites.descripcion + " caracteres.");
  return L;
}

function entrar(correo, clave){
  const u = D.usuarios.find(x => x.correo.toLowerCase() === String(correo).toLowerCase().trim());
  if(!u || u.clave !== clave) return "Ese correo o esa contraseña no coinciden. Revísalos e inténtalo de nuevo.";
  if(u.estado !== "activo") return "Esta cuenta está suspendida. Escribe a MÍA para reactivarla.";
  D.sesion = u.id; guardar();
  const destino = u.rol === "admin" ? "#/admin" : u.rol === "negocio" ? "#/panel" : "#/directorio";
  location.hash = destino; pintar();
  avisar("Bienvenida, " + u.nombre.split(" ")[0] + ".");
  return null;
}

function promedio(id){
  const rs = resenasDe(id, false);
  if(!rs.length) return null;
  return Math.round((rs.reduce((a,r) => a + r.cal, 0) / rs.length) * 10) / 10;

/* ================================================================ PORTADA */
/* Los negocios de ejemplo no traen fotos reales: se dibuja una portada de color
   estable a partir de su nombre, para no depender de imágenes externas. */
const TONOS = [
  ["#D6187F","#7A0E4A"], ["#2D4EC8","#16276B"], ["#0B7A5E","#053F30"],
  ["#C98A00","#6B4A00"], ["#B92A2A","#631515"], ["#6B3FA0","#361F52"]
];
function portadaHtml(n, alto){
  const foto = publico(n).fotos[0];
  const estilo = alto ? 'style="aspect-ratio:21/9"' : "";
  if(foto && !String(foto).startsWith("gen:"))
    return '<div class="portada" ' + estilo + '><img src="' + esc(foto) + '" alt="' + esc(n.nombre) + '"></div>';
  const semillaColor = [...n.nombre].reduce((a,c) => a + c.charCodeAt(0), 0);
  const [a,b] = TONOS[semillaColor % TONOS.length];
  return '<div class="portada" ' + estilo +
    ' data-fondo style="' + (alto ? "aspect-ratio:21/9;" : "") +
    "background:linear-gradient(135deg," + a + "," + b + ')">' +
    '<span class="inicial">' + esc(n.nombre.trim()[0] || "M") + "</span></div>";
}

/* ================================================================== RUTAS */
function ruta(){
  const h = (location.hash || "#/directorio").replace(/^#\/?/, "");
  const partes = h.split("/").filter(Boolean);
  return {vista: partes[0] || "directorio", arg: partes[1] ? decodeURIComponent(partes[1]) : null};
}

function menu(){
  const u = yo(), r = ruta().vista;
  const link = (h, t) => '<a href="#/' + h + '" class="' + (r === h ? "activo" : "") + '">' + t + "</a>";
  let items = link("directorio", "Directorio") + link("planes", "Planes");
  if(!u){
    items += link("ayuda", "Cómo entrar") +
      '<a href="#/entrar" class="btn chico" style="margin-left:6px">Entrar</a>';
  } else {
    if(u.rol === "admin")   items += link("admin", "Administración");
    if(u.rol === "negocio") items += link("panel", "Mis negocios");
    if(u.rol === "usuario") items += link("favoritos", "Favoritos");
    items += '<button class="btn fantasma chico" onclick="salir()">Salir</button>';
  }
  $("menu").innerHTML = items;
}

function pintar(){
  const {vista, arg} = ruta();
  const u = yo();
  let html = "";

  if(vista === "negocio")            html = vistaNegocio(arg);
  else if(vista === "entrar")        html = vistaEntrar();
  else if(vista === "ayuda")         html = vistaAyuda();
  else if(vista === "planes")        html = vistaPlanes();
  else if(vista === "favoritos")     html = vistaFavoritos();
  else if(vista === "panel")         html = u && (u.rol === "negocio" || u.rol === "admin") ? vistaPanel() : sinAcceso();
  else if(vista === "editar")        html = u ? vistaEditar(arg) : sinAcceso();
  else if(vista === "admin")         html = esAdmin() ? vistaAdmin(arg) : sinAcceso();
  else                               html = vistaDirectorio();

  $("app").innerHTML = html;
  menu();
  window.scrollTo(0, 0);
  if(typeof pintar._despues === "function"){ const f = pintar._despues; pintar._despues = null; f(); }
}

/* ============================================================== DIRECTORIO */
let filtro = {q:"", categoria:"", entidad:""};

function ordenados(lista){
  return lista.slice().sort((a,b) => {
    const pa = publico(a), pb = publico(b);
    if(pa.destacado !== pb.destacado) return pa.destacado ? -1 : 1;
    const peso = x => ORDEN_PLANES.indexOf(publico(x).reglas.efectivo);
    if(peso(a) !== peso(b)) return peso(b) - peso(a);
    return (promedio(b.id) || 0) - (promedio(a.id) || 0);
  });
}

function vistaDirectorio(){
  const visibles = D.negocios.filter(n => n.estado === "publicado");
  const res = ordenados(visibles.filter(n => {
    const t = (n.nombre + " " + n.descripcion + " " + n.municipio).toLowerCase();
    if(filtro.q && !t.includes(filtro.q.toLowerCase())) return false;
    if(filtro.categoria && n.categoria !== filtro.categoria) return false;
    if(filtro.entidad && n.entidad !== filtro.entidad) return false;
    return true;

  const chips = CATEGORIAS.map(c => {

    return '<button class="chip ' + (activo ? "rosa" : "") + '" style="cursor:pointer" ' +

  return (
  '<section class="hero"><div class="envoltura">' +
    '<p class="eyebrow">Directorio nacional</p>' +

      '<button class="btn" onclick="buscar()">Buscar</button>' +
    "</div>" +
  "</div></section>" +

  '<div class="envoltura bloque pila g24">' +
    '<div class="pila g12">' +
      '<div class="fila entre g12">' +
        '<p class="eyebrow">Filtrar por giro</p>' +
        (filtro.categoria || filtro.entidad || filtro.q
          ? '<button class="btn fantasma chico" onclick="limpiar()">Quitar filtros</button>' : "") +
      "</div>" +
      '<div class="fila g8">' + chips + "</div>" +
      '<div style="max-width:280px"><label class="campo">Estado de la República' +
        '<select onchange="filtrarEntidad(this.value)">' +
          '<option value="">Toda la República</option>' +

            (filtro.entidad === e ? " selected" : "") + ">" + esc(e) + "</option>").join("") +
        "</select></label></div>" +

    '<hr class="separador">' +
    '<p class="pequeno apagado">' + res.length +
      (res.length === 1 ? " negocio encontrado" : " negocios encontrados") + "</p>" +

    (res.length
      ? '<div class="rejilla">' + res.map(tarjeta).join("") + "</div>"

        esc(n.municipio) + ", " + esc(n.entidad) + "</p>" +
      '<p class="pequeno" style="color:var(--texto2);flex:1">' +
        esc(p.descripcion.slice(0, 96)) + (p.descripcion.length > 96 ? "…" : "") + "</p>" +
      '<div class="fila g8">' + estrellasHtml(prom) +
        (rs ? '<span class="pequeno apagado">(' + rs + ")</span>" : "") + "</div>" +
    "</div></a>";
}

function buscar(){ filtro.q = val("q"); pintar(); }
function filtrarCategoria(id){ filtro.categoria = filtro.categoria === id ? "" : id; pintar(); }
function filtrarEntidad(v){ filtro.entidad = v; pintar(); }
function limpiar(){ filtro = {q:"", categoria:"", entidad:""}; pintar(); }

/* ================================================================= NEGOCIO */
function vistaNegocio(slug){
  const n = D.negocios.find(x => x.slug === slug);
  if(!n) return '<div class="envoltura bloque"><h2>No encontramos ese negocio</h2>' +
    '<p class="apagado">Puede que ya no esté publicado.</p>' +
    '<p style="margin-top:14px"><a class="btn" href="#/directorio">Volver al directorio</a></p></div>';

  const u = yo(), p = publico(n), mio = u && (n.duena === u.id || u.rol === "admin");
  if(n.estado !== "publicado" && !mio)
    return '<div class="envoltura bloque"><h2>Este negocio no está publicado</h2>' +
      '<p class="apagado">Su ficha no está disponible en este momento.</p>' +
      '<p style="margin-top:14px"><a class="btn" href="#/directorio">Volver al directorio</a></p></div>';

  const prom = promedio(n.id), rs = resenasDe(n.id, false);
  const esFav = u && D.favoritos.some(f => f.usuario === u.id && f.negocio === n.id);
  const miResena = u ? rs.find(r => r.usuario === u.id) : null;

  const contacto = [];
  if(n.telefono) contacto.push('<a class="btn linea" href="tel:' + esc(n.telefono.replace(/\s/g,"")) + '">Llamar ' + esc(n.telefono) + "</a>");
  if(p.whatsapp) contacto.push('<a class="btn" href="https://wa.me/52' + esc(p.whatsapp.replace(/\D/g,"")) + '" target="_blank" rel="noopener">WhatsApp</a>');
  if(p.sitio)    contacto.push('<a class="btn linea" href="' + esc(p.sitio) + '" target="_blank" rel="noopener">Sitio web</a>');
  const redes = [];
  if(p.redes.instagram) redes.push("Instagram " + esc(p.redes.instagram));
  if(p.redes.facebook)  redes.push("Facebook " + esc(p.redes.facebook));
  if(p.redes.tiktok)    redes.push("TikTok " + esc(p.redes.tiktok));

  return (
  portadaHtml(n, true) +
  '<div class="envoltura bloque pila g24">' +
    '<div class="pila g12">' +
      '<div class="fila g8">' +
        (p.destacado ? '<span class="chip rosa">Destacado</span>' : "") +
        (p.verificado ? '<span class="chip jade">Verificado por MÍA</span>' : "") +
        '<span class="chip">' + esc(catNombre(n.categoria)) + "</span>" +
        (n.estado !== "publicado" ? '<span class="chip ' + ESTADOS[n.estado].chip + '">' +
          esc(ESTADOS[n.estado].et) + "</span>" : "") +
      "</div>" +
      "<h1>" + esc(n.nombre) + "</h1>" +
      '<div class="fila g12">' + estrellasHtml(prom) +
        '<span class="pequeno apagado">' + rs.length +
        (rs.length === 1 ? " reseña" : " reseñas") + "</span>" +
        '<span class="pequeno apagado">·</span>' +
        '<span class="pequeno apagado">' + esc(n.municipio) + ", " + esc(n.entidad) + "</span>" +
      "</div>" +
      '<p class="pequeno apagado">Atendido por ' + esc(usuarioPorId(n.duena)?.nombre || "—") + "</p>" +
    "</div>" +

    '<p style="max-width:66ch;white-space:pre-wrap">' + esc(p.descripcion) + "</p>" +

    (n.direccion ? '<p class="pequeno apagado">📍 ' + esc(n.direccion) + "</p>" : "") +
    '<div class="fila g8">' + contacto.join("") +
      (u && u.rol === "usuario"
        ? '<button class="btn ' + (esFav ? "" : "linea") + '" onclick="alternarFavorito(' + n.id + ')">' +
          (esFav ? "♥ En tus favoritos" : "♡ Guardar en favoritos") + "</button>"
        : "") +
    "</div>" +
    (redes.length ? '<p class="pequeno apagado">' + redes.join(" · ") + "</p>" : "") +

    (p.fotos.length > 1
      ? '<div class="pila g12"><p class="eyebrow">Galería</p><div class="galeria">' +
        p.fotos.map(f => '<div class="foto">' +
          (String(f).startsWith("gen:")
            ? '<div style="width:100%;height:100%;background:linear-gradient(135deg,' +
              TONOS[Number(String(f).slice(4)) % TONOS.length].join(",") + ')"></div>'
            : '<img src="' + esc(f) + '" alt="Fotografía de ' + esc(n.nombre) + '">') +
          "</div>").join("") + "</div></div>"
      : "") +

    (p.productos.length
      ? '<div class="pila g12"><p class="eyebrow">Productos y servicios</p>' +
        '<div class="rejilla">' + p.productos.map(pr =>
          '<div class="tarjeta p16 pila g8"><strong>' + esc(pr.nombre) + "</strong>" +
          (pr.desc ? '<p class="pequeno apagado">' + esc(pr.desc) + "</p>" : "") +
          (pr.precio ? '<p class="mono" style="font-weight:700">' + pesos(pr.precio) + "</p>" : "") +
          "</div>").join("") + "</div></div>"
      : "") +

    '<hr class="separador">' +
    '<div class="pila g16"><p class="eyebrow">Reseñas de clientas</p>' +
      (u && u.rol === "usuario" ? formularioResena(n, miResena)
        : !u ? '<div class="aviso">Para dejar una reseña necesitas ' +
            '<a href="#/entrar" style="color:var(--acento);font-weight:700">entrar con tu correo</a>.</div>'
        : "") +
      (rs.length
        ? rs.map(r => bloqueResena(r, n, u)).join("")
        : '<p class="apagado pequeno">Este negocio todavía no tiene reseñas. Sé la primera.</p>') +
    "</div>" +

}

function formularioResena(n, mia){
  const cal = mia ? mia.cal : 0;
  return '<div class="tarjeta p20 pila g12">' +
    "<strong>" + (mia ? "Edita tu reseña" : "Deja tu reseña") + "</strong>" +
    '<div class="selector-estrellas" id="sel">' +
      [1,2,3,4,5].map(i => '<button type="button" class="' + (i <= cal ? "on" : "") +
        '" onclick="elegirEstrella(' + i + ')" aria-label="' + i + ' estrellas">★</button>').join("") +
    "</div>" +
    '<input type="hidden" id="cal" value="' + cal + '">' +
    '<textarea id="texto" placeholder="Cuéntanos cómo te fue.">' + esc(mia ? mia.texto : "") + "</textarea>" +
    '<div class="fila g8"><button class="btn" onclick="guardarResena(' + n.id + ')">' +
      (mia ? "Actualizar reseña" : "Publicar reseña") + "</button>" +
      (mia ? '<button class="btn linea" onclick="borrarResena(' + mia.id + ')">Borrar</button>' : "") +
    "</div></div>";
}

function bloqueResena(r, n, u){
  const puedeResponder = u && (u.id === n.duena || u.rol === "admin") && reglas(n).permisos.responder;
  const autor = usuarioPorId(r.usuario);
  return '<div class="tarjeta p16 pila g8">' +
    '<div class="fila entre g8"><strong class="pequeno">' + esc(autor?.nombre || "Usuaria") + "</strong>" +
      '<span class="pequeno apagado">' + esc(fecha(r.fecha)) + "</span></div>" +
    estrellasHtml(r.cal) +
    "<p>" + esc(r.texto) + "</p>" +
    (r.respuesta
      ? '<div style="border-left:3px solid var(--acento);padding-left:11px;margin-top:4px">' +
        '<p class="eyebrow">Respuesta del negocio</p><p class="pequeno">' + esc(r.respuesta) + "</p></div>"
      : "") +
    (puedeResponder && !r.respuesta
      ? '<div class="pila g8" style="margin-top:6px">' +
        '<textarea id="resp' + r.id + '" style="min-height:64px" placeholder="Responde con amabilidad…"></textarea>' +
        '<div><button class="btn chico" onclick="responder(' + r.id + ')">Responder</button></div></div>'
      : "") +
    (u && (u.id === n.duena) && !reglas(n).permisos.responder
      ? '<p class="pequeno apagado">Responder reseñas empieza en el plan Emprende.</p>' : "") +
    "</div>";
}

function elegirEstrella(i){
  $("cal").value = i;
  [...$("sel").children].forEach((b, k) => b.classList.toggle("on", k < i));
}

function guardarResena(negocioId){
  const u = yo(); if(!u) return;
  const cal = Number(val("cal"));
  if(!cal) return avisar("Elige de 1 a 5 estrellas.");
  const texto = val("texto");
  if(texto.length < 4) return avisar("Escribe unas palabras sobre tu experiencia.");
  const ya = D.resenas.find(r => r.negocio === negocioId && r.usuario === u.id);
  if(ya){ ya.cal = cal; ya.texto = texto; }
  else D.resenas.push({id: D.siguiente.resena++, negocio:negocioId, usuario:u.id, cal,
    texto, respuesta:"", estado:"publicada", fecha:new Date().toISOString().slice(0,10)});
  guardar(); pintar(); avisar(ya ? "Actualizamos tu reseña." : "Publicamos tu reseña. Gracias.");
}

function borrarResena(id){
  D.resenas = D.resenas.filter(r => r.id !== id);
  guardar(); pintar(); avisar("Borramos tu reseña.");
}

function responder(id){
  const t = $("resp" + id).value.trim();
  if(!t) return avisar("Escribe tu respuesta.");
  const r = D.resenas.find(x => x.id === id);
  r.respuesta = t; guardar(); pintar(); avisar("Publicamos tu respuesta.");
}

function alternarFavorito(id){
  const u = yo(); if(!u) return;
  const i = D.favoritos.findIndex(f => f.usuario === u.id && f.negocio === id);
  if(i >= 0){ D.favoritos.splice(i,1); avisar("Lo quitamos de tus favoritos."); }
  else { D.favoritos.push({usuario:u.id, negocio:id}); avisar("Lo guardamos en tus favoritos."); }
  guardar(); pintar();
}

/* =============================================================== FAVORITOS */
function vistaFavoritos(){
  const u = yo();
  if(!u) return sinAcceso();
  const lista = D.favoritos.filter(f => f.usuario === u.id)
    .map(f => negocioPorId(f.negocio)).filter(n => n && n.estado === "publicado");
  return '<div class="envoltura bloque pila g24">' +
    '<div class="pila g8"><p class="eyebrow">Tu cuenta</p><h1>Tus favoritos</h1>' +
    '<p class="apagado">Los negocios que guardaste para no perderlos de vista.</p></div>' +
    (lista.length
      ? '<div class="rejilla">' + lista.map(tarjeta).join("") + "</div>"
      : '<div class="tarjeta p24 pila g12"><h3>Todavía no guardas ninguno</h3>' +
        '<p class="apagado pequeno">Abre cualquier negocio y toca “Guardar en favoritos”.</p>' +
        '<div><a class="btn" href="#/directorio">Ver el directorio</a></div></div>') +
    "</div>";
}

/* =================================================================== PANEL */
/* Cuántos negocios puede tener: manda la mejor membresía vigente que traiga,
   no la del primero de la lista. Si venció, cuenta como plan gratuito. */
function planDeLaDuena(usuarioId){
  let mejor = "gratis";
  for(const n of D.negocios.filter(x => x.duena === usuarioId)){
    const e = reglas(n).efectivo;
    if(ORDEN_PLANES.indexOf(e) > ORDEN_PLANES.indexOf(mejor)) mejor = e;
  }
  return mejor;
}

function vistaPanel(){
  const u = yo();
  const mios = D.negocios.filter(n => n.duena === u.id);
  const plan = planDeLaDuena(u.id);
  const tope = PLANES[plan].limites.negocios;
  const puedeMas = mios.length < tope;

  return '<div class="envoltura bloque pila g24">' +
    '<div class="fila entre g12">' +
      '<div class="pila g8"><p class="eyebrow">Panel de negocio</p>' +
      "<h1>Mis negocios</h1></div>" +
      (puedeMas
        ? '<button class="btn" onclick="nuevoNegocio()">Registrar un negocio</button>'
        : '<span class="chip sol">Tu plan permite ' + tope + " negocio(s)</span>") +
    "</div>" +

    (mios.length === 0
      ? '<div class="tarjeta p24 pila g12"><h3>Registra tu primer negocio</h3>' +
        '<p class="apagado pequeno">Es gratis. Llenas tus datos, lo mandas a revisión y MÍA lo publica ' +
        "en el directorio.</p><div><button class=\"btn\" onclick=\"nuevoNegocio()\">Empezar</button></div></div>"
      : '<div class="pila g16">' + mios.map(fichaPanel).join("") + "</div>") +
  "</div>";
}

  const r = reglas(n), av = bloqueos(n), prom = promedio(n.id);
  return '<div class="tarjeta p20 pila g12">' +
    '<div class="fila entre g12">' +
      '<div class="pila g8" style="flex:1;min-width:200px">' +
        '<div class="fila g8">' +
          '<span class="chip ' + ESTADOS[n.estado].chip + '">' + esc(ESTADOS[n.estado].et) + "</span>" +
          '<span class="chip ' + (r.vencida ? "peligro" : "cobalto") + '">' +

          (n.verificado && r.permisos.insignia ? '<span class="chip jade">Verificado</span>' : "") +
        "</div>" +
        "<h3>" + esc(n.nombre) + "</h3>" +
        '<p class="pequeno apagado">' + esc(catNombre(n.categoria)) + " · " +
          esc(n.municipio || "Sin municipio") + "</p>" +

        (n.estado === "publicado"
          ? '<a class="btn fantasma chico" href="#/negocio/' + esc(n.slug) + '">Ver ficha</a>' : "") +
      "</div>" +
    "</div>" +

    (n.estado === "borrador"
      ? '<div class="aviso">Este negocio todavía no lo ve nadie. Cuando esté listo, mándalo a revisión.' +
        '<button class="btn chico" style="margin-left:auto" onclick="mandarRevision(' + n.id + ')">Mandar a revisión</button></div>'
      : "") +
    (n.estado === "rechazado" && n.nota
      ? '<div class="aviso alerta"><div><strong>MÍA pidió cambios:</strong> ' + esc(n.nota) +
        '<br><button class="btn chico" style="margin-top:8px" onclick="mandarRevision(' + n.id + ')">Volver a mandar</button></div></div>'
      : "") +
    (n.estado === "suspendido"
      ? '<div class="aviso alerta">MÍA detuvo la publicación de este negocio' +
        (n.nota ? ": " + esc(n.nota) : ".") + " Escríbeles para resolverlo.</div>"
      : "") +

    (av.length
      ? '<div class="aviso candado"><div><strong>Tu plan está ocultando cosas:</strong><ul style="margin:6px 0 0;padding-left:18px">' +
        av.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>" +
        '<a class="btn chico" style="margin-top:9px" href="#/planes">Ver planes</a></div></div>'
      : "") +

    (r.permisos.estadisticas
      ? '<div class="metricas">' +
          metrica(n.vistas, "Visitas") +
          metrica(D.favoritos.filter(f => f.negocio === n.id).length, "Favoritos", "cobalto") +
          metrica(resenasDe(n.id, false).length, "Reseñas", "jade") +
          metrica(prom ? prom.toFixed(1) : "—", "Calificación", "sol") +
        "</div>"
      : '<p class="pequeno apagado">Las estadísticas de tu negocio empiezan en el plan Emprende.</p>') +
  "</div>";
}

const metrica = (n, et, tono) => '<div class="metrica ' + (tono || "") + '">' +
  '<div class="n">' + esc(n) + '</div><div class="et">' + esc(et) + "</div></div>";

function nuevoNegocio(){
  const u = yo();
  const mios = D.negocios.filter(n => n.duena === u.id);
  const plan = planDeLaDuena(u.id);
  if(mios.length >= PLANES[plan].limites.negocios)
    return avisar("Tu plan " + PLANES[plan].nombre + " permite " + PLANES[plan].limites.negocios + " negocio(s).");
  const id = D.siguiente.negocio++;
  D.negocios.push({id, duena:u.id, nombre:"Mi negocio", slug:slugificar("mi-negocio-" + id),
    categoria:"otros", entidad:"", municipio:"", descripcion:"", direccion:"", telefono:"",
    whatsapp:"", sitio:"", instagram:"", facebook:"", tiktok:"", plan:"gratis", vence:null,
    estado:"borrador", verificado:false, destacado:false, vistas:0, fotos:[], productos:[], nota:""});
  guardar(); location.hash = "#/editar/" + id; pintar();
}

function mandarRevision(id){
  const n = negocioPorId(id);
  if(!n.nombre.trim() || n.nombre === "Mi negocio") return avisar("Ponle nombre a tu negocio antes de mandarlo.");
  if(!n.descripcion.trim()) return avisar("Escribe de qué se trata tu negocio antes de mandarlo.");
  if(!n.entidad) return avisar("Elige el estado de la República donde estás.");
  n.estado = "pendiente"; n.nota = "";
  anotar("Negocio enviado a revisión", n.nombre);
  guardar(); pintar(); avisar("Lo mandamos a revisión. MÍA te avisa cuando lo publique.");
}

function guardarNegocio(id){
  const n = negocioPorId(id), P = reglas(n).permisos;
  const nombre = val("f_nombre");
  if(!nombre) return avisar("El negocio necesita un nombre.");
  if(nombre !== n.nombre){ n.nombre = nombre; n.slug = slugificar(nombre); }
  n.categoria = val("f_categoria");
  n.entidad = val("f_entidad");
  n.municipio = val("f_municipio");
  n.descripcion = val("f_descripcion");
  n.direccion = val("f_direccion");
  n.telefono = val("f_telefono");
  // Los campos bloqueados no se sobrescriben: lo capturado con un plan mayor se respeta.
  if(P.whatsapp) n.whatsapp = val("f_whatsapp");
  if(P.sitioWeb) n.sitio = val("f_sitio");
  if(P.redes){ n.instagram = val("f_instagram"); n.facebook = val("f_facebook"); n.tiktok = val("f_tiktok"); }
  guardar(); pintar(); avisar("Guardamos los cambios.");
}

function subirFoto(id, input){
  const archivo = input.files && input.files[0];
  if(!archivo) return;
  const lector = new FileReader();
  lector.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const max = 900;
      let {width:w, height:h} = img;
      if(w > max || h > max){ const k = Math.min(max/w, max/h); w = Math.round(w*k); h = Math.round(h*k); }
      const lienzo = document.createElement("canvas");
      lienzo.width = w; lienzo.height = h;
      lienzo.getContext("2d").drawImage(img, 0, 0, w, h);
      const n = negocioPorId(id);
      n.fotos = n.fotos || [];
      n.fotos.push(lienzo.toDataURL("image/jpeg", 0.72));
      if(guardar()){ pintar(); avisar("Subimos tu fotografía."); }
      else { n.fotos.pop(); pintar(); }
    };
    img.onerror = () => avisar("No pudimos leer esa imagen. Intenta con otra.");
    img.src = ev.target.result;
  };
  lector.readAsDataURL(archivo);
}

function quitarFoto(id, i){
  const n = negocioPorId(id);
  n.fotos.splice(i, 1); guardar(); pintar(); avisar("Quitamos la fotografía.");
}

function agregarProducto(id){
  const n = negocioPorId(id), L = reglas(n).limites;
  const nombre = val("p_nombre");
  if(!nombre) return avisar("Escribe el nombre del producto.");
  n.productos = n.productos || [];
  if(n.productos.length >= L.productos)
    return avisar("Tu plan permite " + L.productos + " productos.");
  n.productos.push({id:Date.now(), nombre, precio: val("p_precio") ? Number(val("p_precio")) : null, desc: val("p_desc")});
  guardar(); pintar(); avisar("Agregamos el producto.");
}

function quitarProducto(id, i){
  const n = negocioPorId(id);
  n.productos.splice(i, 1); guardar(); pintar(); avisar("Quitamos el producto.");
}

  const vence = plan === "gratis" ? null
    : new Date(Date.now() + 30*864e5).toISOString().slice(0,10);

function hacerRegistro(){
  const nombre = val("r_nombre"), correo = val("r_correo").toLowerCase(),
        clave = val("r_clave"), rol = val("r_rol");
  const decir = m => { if($("r_error")) $("r_error").textContent = m; };
  if(nombre.length < 2) return decir("Escribe tu nombre.");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(correo)) return decir("Ese correo no parece válido.");
  if(clave.length < 8) return decir("La contraseña necesita al menos 8 caracteres.");
  if(D.usuarios.some(u => u.correo.toLowerCase() === correo))
    return decir("Ya existe una cuenta con ese correo. Entra con tu contraseña.");
  const u = {id: D.siguiente.usuario++, nombre, correo, clave, rol, estado:"activo"};
  D.usuarios.push(u); D.sesion = u.id;
  anotar("Cuenta creada", nombre + " (" + rol + ")");
  guardar();
  location.hash = rol === "negocio" ? "#/panel" : "#/directorio";
  pintar(); avisar("Tu cuenta quedó lista, " + nombre.split(" ")[0] + ".");
}

  n.estado = "suspendido"; n.nota = nota;
  anotar("Negocio suspendido", n.nombre + ": " + nota); guardar(); pintar();
  avisar("Suspendimos " + n.nombre + ".");
}
function adminVerificar(id){
  const n = negocioPorId(id);
  n.verificado = !n.verificado;
  anotar(n.verificado ? "Negocio verificado" : "Verificación retirada", n.nombre);
  guardar(); pintar();
  avisar(n.verificado
    ? (reglas(n).permisos.insignia
        ? "Verificamos " + n.nombre + "."
        : "Quedó verificado, pero la insignia solo se muestra con plan Impulsa.")
    : "Le quitamos la verificación.");
}
function adminDestacar(id){
  const n = negocioPorId(id);
  n.destacado = !n.destacado;
  anotar(n.destacado ? "Negocio destacado" : "Destacado retirado", n.nombre);
  guardar(); pintar();
  avisar(n.destacado
    ? (reglas(n).permisos.prioridad
        ? "Ahora aparece primero."
        : "Quedó marcado, pero aparecer primero requiere plan Impulsa.")
    : "Le quitamos el destacado.");
}
function adminPlan(id, plan){
  const n = negocioPorId(id);
  n.plan = plan;
  n.vence = plan === "gratis" ? null : new Date(Date.now() + 30*864e5).toISOString().slice(0,10);
  anotar("Plan cambiado", n.nombre + " → " + PLANES[plan].nombre);
  guardar(); pintar(); avisar(n.nombre + " ahora tiene el plan " + PLANES[plan].nombre + ".");
}

function adminUsuarias(){
  const rolEt = {admin:"Organización MÍA", negocio:"Dueña de negocio", usuario:"Clienta"};
  const filas = D.usuarios.map(u => {
    const suyos = D.negocios.filter(n => n.duena === u.id).length;
    const esYo = u.id === D.sesion;
    return "<tr><td><strong>" + esc(u.nombre) + '</strong><br><span class="pequeno apagado mono">' +
        esc(u.correo) + "</span></td>" +
      '<td><select onchange="adminRol(' + u.id + ',this.value)"' + (esYo ? " disabled" : "") +
        ' style="min-width:140px">' +
        Object.entries(rolEt).map(([k, t]) => '<option value="' + k + '"' +
          (u.rol === k ? " selected" : "") + ">" + esc(t) + "</option>").join("") + "</select></td>" +
      '<td><span class="chip ' + (u.estado === "activo" ? "jade" : "peligro") + '">' +
        (u.estado === "activo" ? "Activa" : "Suspendida") + "</span></td>" +
      '<td class="mono">' + suyos + "</td>" +
      "<td>" + (esYo
        ? '<span class="pequeno apagado">Eres tú</span>'
        : '<button class="btn ' + (u.estado === "activo" ? "peligro" : "") + ' chico" onclick="adminSuspenderUsuaria(' +
          u.id + ')">' + (u.estado === "activo" ? "Suspender" : "Reactivar") + "</button>") + "</td></tr>";
  }).join("");

  return '<div class="pila g8"><p class="eyebrow">Organización MÍA</p><h1>Usuarias</h1>' +
    '<p class="apagado pequeno">Cambia el tipo de cuenta o suspende el acceso. Al suspender, ' +
    "la sesión de esa persona deja de servir de inmediato.</p></div>" +
    '<div class="tabla-envoltura"><table><thead><tr><th>Persona</th><th>Tipo de cuenta</th>' +
    "<th>Estado</th><th>Negocios</th><th>Acción</th></tr></thead><tbody>" + filas + "</tbody></table></div>";
}

function adminRol(id, rol){
  const u = usuarioPorId(id);
  u.rol = rol; anotar("Tipo de cuenta cambiado", u.nombre + " → " + rol);
  guardar(); pintar(); avisar("Actualizamos el tipo de cuenta de " + u.nombre + ".");
}

function adminSuspenderUsuaria(id){
  const u = usuarioPorId(id);
  u.estado = u.estado === "activo" ? "suspendido" : "activo";
  anotar(u.estado === "activo" ? "Cuenta reactivada" : "Cuenta suspendida", u.nombre);
  guardar(); pintar();
  avisar(u.estado === "activo" ? "Reactivamos a " + u.nombre + "." : "Suspendimos a " + u.nombre + ".");
}

function adminResenas(){
  const filas = D.resenas.slice().reverse().map(r => {
    const n = negocioPorId(r.negocio), a = usuarioPorId(r.usuario);
    return "<tr><td>" + estrellasHtml(r.cal) + "<p class=\"pequeno\" style=\"margin-top:4px\">" +
        esc(r.texto.slice(0,120)) + (r.texto.length > 120 ? "…" : "") + "</p></td>" +
      '<td class="pequeno">' + esc(n?.nombre || "—") + "</td>" +
      '<td class="pequeno">' + esc(a?.nombre || "—") + "</td>" +
      '<td><span class="chip ' + (r.estado === "publicada" ? "jade" : "peligro") + '">' +
        (r.estado === "publicada" ? "Publicada" : "Oculta") + "</span></td>" +
      '<td><button class="btn ' + (r.estado === "publicada" ? "peligro" : "") +
        ' chico" onclick="adminOcultar(' + r.id + ')">' +
        (r.estado === "publicada" ? "Ocultar" : "Publicar") + "</button></td></tr>";
  }).join("");

  return '<div class="pila g8"><p class="eyebrow">Organización MÍA</p><h1>Reseñas</h1>' +
    '<p class="apagado pequeno">Oculta las reseñas ofensivas o con publicidad. ' +
    "Una reseña oculta deja de contar para la calificación.</p></div>" +
    '<div class="tabla-envoltura"><table><thead><tr><th>Reseña</th><th>Negocio</th>' +
    "<th>Autora</th><th>Estado</th><th>Acción</th></tr></thead><tbody>" + filas + "</tbody></table></div>";
}

function adminOcultar(id){
  const r = D.resenas.find(x => x.id === id);
  r.estado = r.estado === "publicada" ? "oculta" : "publicada";
  anotar(r.estado === "oculta" ? "Reseña ocultada" : "Reseña restituida",
    negocioPorId(r.negocio)?.nombre || "");
  guardar(); pintar();
  avisar(r.estado === "oculta" ? "Ocultamos la reseña." : "La reseña volvió a publicarse.");
}

function adminBitacora(){
  return '<div class="pila g8"><p class="eyebrow">Organización MÍA</p><h1>Bitácora</h1>' +
    '<p class="apagado pequeno">Queda registro de cada acción administrativa.</p></div>' +
    (D.bitacora.length
      ? '<div class="tabla-envoltura"><table><thead><tr><th>Cuándo</th><th>Quién</th>' +
        "<th>Acción</th><th>Detalle</th></tr></thead><tbody>" +
        D.bitacora.map(b => '<tr><td class="mono pequeno">' +
          esc(new Date(b.cuando).toLocaleString("es-MX")) + "</td>" +
          '<td class="pequeno">' + esc(usuarioPorId(b.actor)?.nombre || "Sistema") + "</td>" +
          "<td><strong>" + esc(b.accion) + "</strong></td>" +
          '<td class="pequeno apagado">' + esc(b.detalle) + "</td></tr>").join("") +
        "</tbody></table></div>"
      : '<div class="tarjeta p24"><p class="apagado pequeno">Todavía no hay movimientos. ' +
        "Publica o suspende un negocio y aparecerá aquí.</p></div>");
}

/* ================================================================= ARRANQUE */
// Cuenta una visita cuando alguien abre la ficha de un negocio publicado.
let ultimaVista = null;
window.addEventListener("hashchange", () => {
  const {vista, arg} = ruta();
  if(vista === "negocio" && arg !== ultimaVista){
    const n = D.negocios.find(x => x.slug === arg);
    if(n && n.estado === "publicado"){ n.vistas++; guardar(); }
    ultimaVista = arg;
  }
  pintar();
});

pintar();
</script>
