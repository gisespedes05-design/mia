<title>MÍA — Directorio de negocios de mujeres</title>

<style>
:root{
  --fondo:#FBF7F4; --fondo2:#F2EAE6; --superficie:#FFFFFF;
  --texto:#241023; --texto2:#6B5A66; --linea:#E4D8D3;
  --acento:#D6187F; --acento-tinta:#FFFFFF; --acento-suave:#FCE7F2;
  --cobalto:#2D4EC8; --sol:#C98A00; --jade:#0B7A5E; --peligro:#B92A2A;
  --sombra:0 1px 2px rgba(36,16,35,.06), 0 8px 24px -12px rgba(36,16,35,.14);
  --r:4px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --fondo:#17101A; --fondo2:#201726; --superficie:#241B2C;
    --texto:#F6EEF3; --texto2:#B4A2B0; --linea:#3A2C43;
    --acento:#FF5BAE; --acento-tinta:#2A0A1C; --acento-suave:#3A1330;
    --cobalto:#8AA0F5; --sol:#F5C43A; --jade:#46C89E; --peligro:#FF8080;
    --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --fondo:#17101A; --fondo2:#201726; --superficie:#241B2C;
  --texto:#F6EEF3; --texto2:#B4A2B0; --linea:#3A2C43;
  --acento:#FF5BAE; --acento-tinta:#2A0A1C; --acento-suave:#3A1330;
  --cobalto:#8AA0F5; --sol:#F5C43A; --jade:#46C89E; --peligro:#FF8080;
  --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
:root[data-theme="light"]{
  --fondo:#FBF7F4; --fondo2:#F2EAE6; --superficie:#FFFFFF;
  --texto:#241023; --texto2:#6B5A66; --linea:#E4D8D3;
  --acento:#D6187F; --acento-tinta:#FFFFFF; --acento-suave:#FCE7F2;
  --cobalto:#2D4EC8; --sol:#C98A00; --jade:#0B7A5E; --peligro:#B92A2A;
  --sombra:0 1px 2px rgba(36,16,35,.06), 0 8px 24px -12px rgba(36,16,35,.14);
}

*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--sans);
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

h1,h2,h3{margin:0;text-wrap:balance;font-weight:800;letter-spacing:-.022em;line-height:1.14}
h1{font-size:clamp(1.9rem,5.2vw,2.9rem)}
h2{font-size:clamp(1.25rem,3vw,1.7rem)}
h3{font-size:1.05rem;letter-spacing:-.012em}
p{margin:0}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--texto2)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.apagado{color:var(--texto2)}
.pequeno{font-size:.86rem}
.diminuto{font-size:.78rem}

.envoltura{max-width:1140px;margin:0 auto;padding:0 20px}
.pila{display:flex;flex-direction:column}
.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g24{gap:24px}.g32{gap:32px}.g48{gap:48px}
.fila{display:flex;align-items:center;flex-wrap:wrap}
.entre{justify-content:space-between}
.arriba{align-items:flex-start}
main{min-height:60vh;padding-bottom:64px}
section.bloque{padding:36px 0}

header.barra{position:sticky;top:0;z-index:40;background:var(--fondo);border-bottom:1px solid var(--linea)}
.barra .envoltura{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:62px}
.marca{display:flex;align-items:center;gap:9px;text-decoration:none;flex-shrink:0}
.marca .glifo{width:30px;height:30px;background:var(--acento);border-radius:50% 50% 50% 2px;flex-shrink:0}
.marca .nombre{font-weight:800;font-size:1.32rem;letter-spacing:-.03em}
nav.menu{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
nav.menu a{padding:7px 10px;border-radius:var(--r);text-decoration:none;font-size:.88rem;
  font-weight:600;color:var(--texto2)}
nav.menu a:hover{background:var(--fondo2);color:var(--texto)}
nav.menu a.activo{color:var(--acento);background:var(--acento-suave)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;
  border-radius:var(--r);border:1px solid transparent;background:var(--acento);
  color:var(--acento-tinta);font:inherit;font-size:.92rem;font-weight:700;cursor:pointer;
  text-decoration:none;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.linea{background:transparent;color:var(--texto);border-color:var(--linea)}
.btn.linea:hover{background:var(--fondo2);filter:none}
.btn.fantasma{background:transparent;color:var(--texto2);padding:7px 10px}
.btn.fantasma:hover{background:var(--fondo2);color:var(--texto);filter:none}
.btn.peligro{background:var(--peligro);color:#fff}
.btn.chico{padding:6px 11px;font-size:.83rem}
.btn.ancho{width:100%}
.btn.claro{background:var(--acento-tinta);color:var(--acento)}

label.campo{display:flex;flex-direction:column;gap:6px;font-size:.83rem;font-weight:700;color:var(--texto2)}
input,select,textarea{font:inherit;font-size:.95rem;padding:10px 12px;border-radius:var(--r);
  border:1px solid var(--linea);background:var(--superficie);color:var(--texto);width:100%;font-weight:400}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input:disabled,textarea:disabled,select:disabled{background:var(--fondo2);color:var(--texto2);cursor:not-allowed}
.rejilla-campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}

.tarjeta{background:var(--superficie);border:1px solid var(--linea);border-radius:var(--r);
  box-shadow:var(--sombra)}
.tarjeta.p12{padding:12px}.tarjeta.p16{padding:16px}.tarjeta.p20{padding:20px}.tarjeta.p24{padding:24px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;
  font-size:.72rem;font-weight:700;background:var(--fondo2);color:var(--texto2);
  border:1px solid var(--linea);white-space:nowrap}
.chip.jade{background:color-mix(in srgb,var(--jade) 14%,transparent);color:var(--jade);
  border-color:color-mix(in srgb,var(--jade) 32%,transparent)}
.chip.sol{background:color-mix(in srgb,var(--sol) 16%,transparent);color:var(--sol);
  border-color:color-mix(in srgb,var(--sol) 36%,transparent)}
.chip.rosa{background:var(--acento-suave);color:var(--acento);
  border-color:color-mix(in srgb,var(--acento) 30%,transparent)}
.chip.cobalto{background:color-mix(in srgb,var(--cobalto) 14%,transparent);color:var(--cobalto);
  border-color:color-mix(in srgb,var(--cobalto) 32%,transparent)}
.chip.peligro{background:color-mix(in srgb,var(--peligro) 13%,transparent);color:var(--peligro);
  border-color:color-mix(in srgb,var(--peligro) 32%,transparent)}
button.chip{cursor:pointer}

.hero{background:var(--acento);color:var(--acento-tinta);padding:52px 0 46px}
.hero h1{max-width:16ch}
.hero p.entrada{max-width:48ch;font-size:1.05rem;opacity:.94;margin-top:14px}
.hero .eyebrow{color:var(--acento-tinta);opacity:.78}
.buscador{display:flex;gap:8px;margin-top:24px;max-width:560px;flex-wrap:wrap}
.buscador input{flex:1 1 220px;border-color:transparent}

.portada{aspect-ratio:16/10;background:var(--fondo2);position:relative;overflow:hidden;
  display:grid;place-items:center}
.portada img{width:100%;height:100%;object-fit:cover}
.portada .inicial{font-size:2.4rem;font-weight:800;color:#fff;opacity:.92;letter-spacing:-.04em;
  text-shadow:0 2px 12px rgba(0,0,0,.22)}
.logo-negocio{width:56px;height:56px;border-radius:var(--r);object-fit:cover;border:1px solid var(--linea);
  flex-shrink:0;background:var(--fondo2)}
.logo-negocio.grande{width:82px;height:82px}
.logo-vacio{display:grid;place-items:center;font-weight:800;font-size:1.5rem;color:#fff}

.rejilla{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(256px,1fr))}
.rejilla.dos{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.rejilla.planes{grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:16px}
.rejilla.cats{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tarjeta-negocio{display:flex;flex-direction:column;overflow:hidden;text-decoration:none;color:inherit;
  transition:transform .14s ease,box-shadow .14s ease}
.tarjeta-negocio:hover{transform:translateY(-2px);
  box-shadow:0 2px 4px rgba(36,16,35,.08),0 16px 32px -16px rgba(36,16,35,.3)}
.tarjeta-negocio .cuerpo{padding:14px;display:flex;flex-direction:column;gap:7px;flex:1}
.tarjeta-cat{display:flex;flex-direction:column;gap:6px;padding:15px;text-decoration:none;color:inherit;
  border:1px solid var(--linea);border-radius:var(--r);background:var(--superficie);
  border-left:3px solid var(--acento);transition:transform .12s ease}
.tarjeta-cat:hover{transform:translateY(-2px)}

.estrellas{color:var(--sol);letter-spacing:.06em;font-size:.9rem}
.selector-estrellas{display:flex;gap:2px}
.selector-estrellas button{background:none;border:none;font-size:1.7rem;cursor:pointer;padding:0 2px;
  color:var(--linea);line-height:1}
.selector-estrellas button.on{color:var(--sol)}

.shell{display:grid;grid-template-columns:216px 1fr;gap:26px;padding-top:26px}
@media (max-width:860px){.shell{grid-template-columns:1fr;gap:16px}}
.lateral{display:flex;flex-direction:column;gap:3px;align-self:start;position:sticky;top:78px}
@media (max-width:860px){.lateral{position:static;flex-direction:row;flex-wrap:wrap;
  border-bottom:1px solid var(--linea);padding-bottom:10px}}
.lateral button{text-align:left;background:none;border:none;font:inherit;font-size:.89rem;font-weight:600;
  color:var(--texto2);padding:9px 12px;border-radius:var(--r);cursor:pointer}
.lateral button:hover{background:var(--fondo2);color:var(--texto)}
.lateral button.activo{background:var(--acento);color:var(--acento-tinta)}

.tabla-envoltura{overflow-x:auto;border:1px solid var(--linea);border-radius:var(--r);background:var(--superficie)}
table{border-collapse:collapse;width:100%;font-size:.87rem;min-width:600px}
th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--linea);vertical-align:middle}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--texto2);font-weight:700;
  background:var(--fondo2);position:sticky;top:0}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--fondo2)}

.metricas{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.metrica{padding:15px;border:1px solid var(--linea);border-radius:var(--r);background:var(--superficie);
  border-left:3px solid var(--acento)}
.metrica .n{font-size:1.85rem;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.metrica .et{font-size:.73rem;text-transform:uppercase;letter-spacing:.1em;color:var(--texto2);
  font-weight:700;margin-top:6px}
.metrica.cobalto{border-left-color:var(--cobalto)}
.metrica.jade{border-left-color:var(--jade)}
.metrica.sol{border-left-color:var(--sol)}

.aviso{padding:12px 14px;border-radius:var(--r);font-size:.87rem;border:1px solid var(--linea);
  background:var(--fondo2);display:flex;gap:9px}
.aviso.candado{background:var(--acento-suave);border-color:color-mix(in srgb,var(--acento) 26%,transparent);
  color:var(--texto)}
.aviso.alerta{background:color-mix(in srgb,var(--sol) 12%,transparent);
  border-color:color-mix(in srgb,var(--sol) 34%,transparent)}
.aviso.bien{background:color-mix(in srgb,var(--jade) 11%,transparent);
  border-color:color-mix(in srgb,var(--jade) 30%,transparent)}

.plan{display:flex;flex-direction:column;gap:12px;padding:22px;border:1px solid var(--linea);
  border-radius:var(--r);background:var(--superficie)}
.plan.destacado{border:2px solid var(--acento);box-shadow:var(--sombra)}
.plan.servicio{border-left:3px solid var(--cobalto)}
.plan .precio{font-size:1.95rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.plan ul{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.87rem}
.plan li{display:flex;gap:8px;align-items:flex-start}
.plan li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acento);
  margin-top:7px;flex-shrink:0}
.plan li.no{color:var(--texto2)}
.plan li.no::before{background:var(--linea)}
.plan.servicio li::before{background:var(--cobalto)}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;background:var(--texto);
  color:var(--fondo);padding:11px 18px;border-radius:var(--r);font-size:.88rem;font-weight:600;
  box-shadow:var(--sombra);max-width:88vw;opacity:0;pointer-events:none;transition:opacity .2s ease}
#toast.ver{opacity:1}

footer{border-top:1px solid var(--linea);padding:26px 0;background:var(--fondo2);font-size:.85rem;color:var(--texto2)}
.separador{height:1px;background:var(--linea);border:none;margin:0}
.galeria{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.galeria .foto{position:relative;aspect-ratio:1;border-radius:var(--r);overflow:hidden;border:1px solid var(--linea)}
.galeria .foto img{width:100%;height:100%;object-fit:cover}
.galeria .foto .quitar{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.62);color:#fff;
  border:none;border-radius:var(--r);cursor:pointer;font-size:.74rem;padding:3px 7px;font-weight:700}
.galeria .foto.oculta img{filter:grayscale(1);opacity:.4}
.galeria .foto .sello{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.68);color:#fff;
  font-size:.68rem;padding:4px 6px;text-align:center;font-weight:700}

/* mapa */
.mapa-caja{background:var(--superficie);border:1px solid var(--linea);border-radius:var(--r);
  overflow:hidden;position:relative}
.mapa-caja svg{width:100%;height:auto;display:block}
.tierra{fill:var(--fondo2);stroke:var(--linea);stroke-width:.9;stroke-linejoin:round}
.pin{cursor:pointer}
.pin circle{stroke:#fff;stroke-width:1.6}
.pin:hover circle{stroke-width:2.6}
.pin.membresia circle{fill:var(--acento)}
.pin.suscripcion circle{fill:var(--cobalto)}

/* publicaciones */
.publicacion{border:1px solid var(--linea);border-radius:var(--r);background:var(--superficie);padding:16px;
  display:flex;flex-direction:column;gap:8px}
.publicacion.destacada{border-left:3px solid var(--acento)}
.articulo p{margin-bottom:14px}
.articulo{max-width:66ch;line-height:1.7}
.subcats{display:flex;flex-wrap:wrap;gap:6px}
.escalones{display:flex;flex-direction:column;gap:14px}
.escalon{display:flex;gap:12px;align-items:flex-start}
.escalon .num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--acento);
  color:var(--acento-tinta);display:grid;place-items:center;font-weight:800;font-size:.8rem}
</style>

<header class="barra">
  <div class="envoltura">
    <a class="marca" href="#/inicio"><span class="glifo"></span><span class="nombre">MÍA</span></a>
    <nav class="menu" id="menu"></nav>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="envoltura pila g8">
    <strong style="color:var(--texto)">MÍA</strong>
    <span>Directorio y comunidad de negocios dirigidos por mujeres.</span>
    <span class="diminuto">Versión de demostración: lo que captures se guarda solo en este navegador.</span>
  </div>
</footer>

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============================================================ ALMACENAMIENTO */
const CLAVE = "mia_v2";
let memoria = null;

function leerCrudo(){ try { return localStorage.getItem(CLAVE); } catch { return memoria; } }
function escribirCrudo(txt){
  try { localStorage.setItem(CLAVE, txt); }
  catch(e){
    memoria = txt;
    if(String(e && e.name).includes("Quota")){
      avisar("Ya no cabe más en la memoria de este navegador. Borra alguna fotografía.");
      return false;
    }
  }
  return true;
}

/* =================================================================== PLANES */
/* Tres niveles de directorio. El Plan de Crecimiento va aparte: no es
   suscripción automática, es un servicio que MÍA cotiza y acompaña. */

    permisos:{ logo:true, contacto:true, redes:false, mapa:false, productosDestacados:false,
      verificado:false, prioridad:false, publicacionesDestacadas:false, estadisticas:false,

    incluye:["Perfil básico","Logo","Una publicación","Datos de contacto",
      "Categoría principal","Hasta cinco subcategorías"],

  },

    limites:{ subcategorias:5, publicaciones:Infinity, fotos:12, descripcion:2000 },

  membresia: {
    id:"membresia", nombre:"Membresía", etiqueta:"$599 MXN al mes", precio:599, peso:2,

    limites:{ subcategorias:5, publicaciones:Infinity, fotos:30, descripcion:4000 },
    permisos:{ logo:true, contacto:true, redes:true, mapa:true, productosDestacados:true,

    incluye:["Todo lo de Suscripción","Perfil verificado","Prioridad en búsquedas",
      "Publicaciones destacadas","Estadísticas","Participación en campañas de MÍA",
      "Mayor visibilidad"],
    excluye:[]

  /* El plan más alto. Lleva todo lo de Membresía y encima los servicios de
     marketing que MÍA presta de forma profesional. El precio es "desde":
     se cotiza según el alcance, por eso el equipo confirma antes de activarlo. */

    id:"crece", nombre:"Crece con MÍA", etiqueta:"Desde $2,500 MXN al mes", precio:2500, peso:3,
    cotizado:true,
    resumen:"Todo lo de Membresía más tu marketing llevado de manera profesional.",
    limites:{ subcategorias:5, publicaciones:Infinity, fotos:40, descripcion:6000 },
    permisos:{ logo:true, contacto:true, redes:true, mapa:true, productosDestacados:true,
      verificado:true, prioridad:true, publicacionesDestacadas:true, estadisticas:true,
      campanas:true, responder:true, acompanamiento:true },
    incluye:["Todo lo de Membresía"],
    servicios:["Estrategia de marketing","Calendario de contenido","Diseño",
      "Administración de redes sociales","Reportes","Reuniones",
      "Acompañamiento personalizado"],
    excluye:[]
  }
};
const ORDEN_PLANES = ["gratuito","suscripcion","membresia","crece"];

/* ============================================================== CATEGORÍAS */
/* Taxonomía definida por MÍA. */
const CATEGORIAS = [
  {id:"belleza", nombre:"Belleza", icono:"💄", sub:["Maquillaje","Pestañas","Cejas","Uñas",
    "Peinado","Barbería","Spa","Faciales","Masajes","Depilación","Micropigmentación",
    "Tratamientos capilares","Skincare","Perfumería"]},
  {id:"moda", nombre:"Moda", icono:"👗", sub:["Ropa para mujer","Boutique","Ropa infantil",
    "Lencería","Bolsos","Zapatos","Accesorios","Bisutería","Joyería","Relojes"]},
  {id:"reposteria", nombre:"Repostería y Alimentos", icono:"🍰", sub:["Pasteles","Cupcakes",
    "Galletas","Postres","Chocolatería","Panadería","Repostería personalizada",
    "Mesas de postres","Comida saludable","Catering","Comida casera","Snacks",
    "Bebidas artesanales"]},

function cargar(){
  const crudo = leerCrudo();
  if(!crudo){ const d = semilla(); escribirCrudo(JSON.stringify(d)); return d; }
  try {
    const d = JSON.parse(crudo);
    if(!d || !Array.isArray(d.usuarios) || !Array.isArray(d.articulos)) throw new Error("viejo");
    return d;
  } catch { const d = semilla(); escribirCrudo(JSON.stringify(d)); return d; }
}

function reiniciar(){
  if(!confirm("Esto borra todo lo que hayas capturado y deja MÍA como recién instalada. ¿Continuamos?")) return;
  D = semilla(); guardar(); location.hash = "#/inicio"; pintar();
  avisar("Listo, MÍA quedó como nueva.");
}

function avisar(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("ver");
  clearTimeout(avisar._t); avisar._t = setTimeout(() => t.classList.remove("ver"), 3400);
}

const pesos = v => (v === null || v === undefined || v === "") ? ""
  : "$" + Number(v).toLocaleString("es-MX",{minimumFractionDigits:0, maximumFractionDigits:2});

function fecha(iso){
  if(!iso) return "";
  const d = new Date(iso + (String(iso).length === 10 ? "T12:00:00" : ""));
  return isNaN(d) ? iso : d.toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"});
}

function slugificar(txt){
  const base = String(txt).normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60) || "negocio";
  let s = base, i = 2;
  while(D.negocios.some(x => x.slug === s)) s = base + "-" + (i++);
  return s;
}

const usuarioPorId = id => D.usuarios.find(u => u.id === id);

function anotar(accion, detalle){
  D.bitacora.unshift({id:Date.now()+Math.random(), actor:D.sesion, accion, detalle,
    cuando:new Date().toISOString()});
  D.bitacora = D.bitacora.slice(0,200);
}

/* Reglas vigentes de un negocio. Si la membresía venció, opera con las del
   plan Gratuito; nada se borra y todo regresa al renovar. */
function reglas(n){
  const contratado = PLANES[n.plan] ? n.plan : "gratuito";
  const vencida = contratado !== "gratuito" && n.vence &&
    new Date(n.vence + "T23:59:59") < new Date();
  const sinPago = contratado !== "gratuito" && n.pagoConfirmado === false;
  const efectivo = (vencida || sinPago) ? "gratuito" : contratado;
  return {contratado, efectivo, vencida, sinPago,
    limites:PLANES[efectivo].limites, permisos:PLANES[efectivo].permisos};
}

/* Lo que el público alcanza a ver: aquí se recorta lo que exceda el plan. */
function publico(n){
  const r = reglas(n);
  const pubs = (n.publicaciones || []).slice()
    .sort((a,b) => (b.destacada?1:0)-(a.destacada?1:0) || String(b.fecha).localeCompare(a.fecha));
  return {
    fotos:(n.fotos || []).slice(0, r.limites.fotos),
    descripcion:(n.descripcion || "").slice(0, r.limites.descripcion),
    redes: r.permisos.redes ? (n.redes || {}) : {instagram:"",facebook:"",tiktok:"",whatsapp:""},
    publicaciones: pubs.slice(0, r.limites.publicaciones === Infinity ? pubs.length : r.limites.publicaciones)
      .map(p => ({...p, destacada: p.destacada && r.permisos.publicacionesDestacadas})),
    productos:(n.productos || []).map(p => ({...p,
      destacado: p.destacado && r.permisos.productosDestacados})),
    verificado: n.verificado && r.permisos.verificado,
    enMapa: r.permisos.mapa && !!CIUDADES[n.ciudad],
    reglas:r
  };
}

/* Avisos para la dueña sobre lo que su plan le está ocultando. */
function bloqueos(n){
  const r = reglas(n), L = [];
  if(r.sinPago) L.push("MÍA todavía no confirma tu pago del plan " + PLANES[r.contratado].nombre +
    ". Mientras tanto tu perfil opera con las reglas del plan Gratuito.");
  if(r.vencida) L.push("Tu plan " + PLANES[r.contratado].nombre + " venció el " + fecha(n.vence) +
    ". Nada se borró: al renovar vuelve a aparecer todo.");
  const fotos = (n.fotos || []).length;
  if(fotos > r.limites.fotos) L.push(r.limites.fotos === 0
    ? "Tus " + fotos + " fotografías están ocultas. Las fotografías empiezan en el plan Suscripción."
    : (fotos - r.limites.fotos) + " de tus " + fotos + " fotografías no se muestran.");
  const pubs = (n.publicaciones || []).length;
  if(r.limites.publicaciones !== Infinity && pubs > r.limites.publicaciones)
    L.push((pubs - r.limites.publicaciones) + " de tus " + pubs +
      " publicaciones no se muestran. El plan Gratuito incluye una.");
  const red = n.redes || {};
  if(!r.permisos.redes && (red.instagram || red.facebook || red.tiktok || red.whatsapp))
    L.push("Tus redes sociales y tu WhatsApp están ocultos. Empiezan en el plan Suscripción.");
  if(!r.permisos.mapa) L.push("Tu negocio no aparece en el mapa. El mapa empieza en el plan Suscripción.");
  if((n.descripcion || "").length > r.limites.descripcion)
    L.push("Tu descripción se muestra recortada a " + r.limites.descripcion + " caracteres.");
  if(n.verificado && !r.permisos.verificado)
    L.push("MÍA te verificó, pero la insignia solo se muestra con Membresía.");
  return L;
}

/* Mejor plan vigente de una dueña: manda para el tope de perfiles. */
function planDeLaDuena(usuarioId){
  let mejor = "gratuito";
  for(const n of D.negocios.filter(x => x.duena === usuarioId)){
    const e = reglas(n).efectivo;
    if(PLANES[e].peso > PLANES[mejor].peso) mejor = e;
  }
  return mejor;
}

function entrar(correo, clave){
  const u = D.usuarios.find(x => x.correo.toLowerCase() === String(correo).toLowerCase().trim());
  if(!u || u.clave !== clave) return "Ese correo o esa contraseña no coinciden. Revísalos e inténtalo otra vez.";
  if(u.estado !== "activo") return "Esta cuenta está suspendida. Escribe a MÍA para reactivarla.";
  D.sesion = u.id; guardar();
  location.hash = u.rol === "admin" ? "#/admin" : u.rol === "negocio" ? "#/panel" : "#/inicio";
  pintar(); avisar("Bienvenida, " + u.nombre.split(" ")[0] + ".");
  return null;
}

const TONOS = [["#D6187F","#7A0E4A"],["#2D4EC8","#16276B"],["#0B7A5E","#053F30"],
  ["#C98A00","#6B4A00"],["#B92A2A","#631515"],["#6B3FA0","#361F52"]];
const tonoDe = txt => TONOS[[...String(txt)].reduce((a,c)=>a+c.charCodeAt(0),0) % TONOS.length];

function imagenHtml(src, alt, clase){
  if(src && !String(src).startsWith("gen:"))
    return '<img class="' + (clase||"") + '" src="' + esc(src) + '" alt="' + esc(alt||"") + '">';

  return '<div class="' + (clase||"") + '" style="width:100%;height:100%;background:linear-gradient(135deg,' +

/* Orden del directorio: Membresía primero, luego Suscripción, luego Gratuito. */
function ordenar(lista){
  return lista.slice().sort((a,b) => {
    const pa = PLANES[reglas(a).efectivo].peso, pb = PLANES[reglas(b).efectivo].peso;
    if(pa !== pb) return pb - pa;
    return (promedio(b.id) || 0) - (promedio(a.id) || 0);
  });
}

const textoDe = n => (n.nombre + " " + n.descripcion + " " + (n.sub||[]).join(" ") + " " +
  (n.ciudad||"") + " " + cat(n.categoria).nombre).toLowerCase();

function coincide(n){
  if(filtro.q && !textoDe(n).includes(filtro.q.toLowerCase())) return false;
  if(filtro.categoria && n.categoria !== filtro.categoria) return false;
  if(filtro.sub && !(n.sub||[]).includes(filtro.sub)) return false;
  if(filtro.ciudad && n.ciudad !== filtro.ciudad) return false;
  return true;
}

function filtrosHtml(){
  const c = filtro.categoria ? CATEGORIAS.find(x => x.id === filtro.categoria) : null;
  return '<div class="pila g12">' +

      "</select></label>" +
      '<label class="campo">Subcategoría<select id="fs" onchange="aplicarFiltros()"' +
        (c ? "" : " disabled") + '><option value="">Todas</option>' +
        (c ? c.sub.map(s => '<option value="' + esc(s) + '"' + (filtro.sub === s ? " selected" : "") +
          ">" + esc(s) + "</option>").join("") : "") + "</select></label>" +

  "</div>";
}

function aplicarFiltros(){
  const antes = filtro.categoria;
  filtro.q = val("q"); filtro.categoria = val("fc"); filtro.ciudad = val("fu");

  pintar();

const LIM = {oe:-118.5, es:-85.5, no:33.5, su:14.0};
const AN = 900, AL = 620;
const proyectar = ([lng,lat]) => [
  ((lng - LIM.oe) / (LIM.es - LIM.oe)) * AN,
  ((LIM.no - lat) / (LIM.no - LIM.su)) * AL
];
const trazo = pts => pts.map(proyectar).map(([x,y],i) =>
  (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1)).join(" ") + " Z";

function dibujarMapa(){
  const caja = $("mapa"); if(!caja) return;
  const enMapa = publicados().filter(n => publico(n).enMapa);

  // Agrupa por ciudad para que dos negocios en la misma ciudad no se encimen.
  const porCiudad = {};
  for(const n of enMapa) (porCiudad[n.ciudad] = porCiudad[n.ciudad] || []).push(n);

  const pins = Object.entries(porCiudad).map(([ciudad, lista]) => {
    const [x,y] = proyectar(CIUDADES[ciudad]);
    return lista.map((n,i) => {
      const ang = i * (Math.PI*2/Math.max(lista.length,1));
      const rad = lista.length > 1 ? 9 : 0;
      const cx = x + Math.cos(ang)*rad, cy = y + Math.sin(ang)*rad;
      const clase = reglas(n).efectivo === "membresia" ? "membresia" : "suscripcion";
      return '<g class="pin ' + clase + '" onclick="location.hash=\'#/negocio/' + esc(n.slug) + '\'">' +
        "<title>" + esc(n.nombre + " — " + ciudad) + "</title>" +
        '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="7"></circle></g>';
    }).join("") +
    '<text x="' + (x+11).toFixed(1) + '" y="' + (y+4).toFixed(1) +
      '" font-size="12" fill="currentColor" opacity=".62">' + esc(ciudad) + "</text>";
  }).join("");

  caja.innerHTML = '<svg viewBox="0 0 ' + AN + " " + AL + '" role="img" ' +
    'aria-label="Mapa de México con los negocios de MÍA">' +
    '<path class="tierra" d="' + trazo(MEXICO) + '"></path>' +
    '<path class="tierra" d="' + trazo(BAJA) + '"></path>' + pins + "</svg>";
}

  $("cal").value = i;

function guardarResena(id){
  const u = yo(); if(!u) return;
  const cal = Number(val("cal"));
  if(!cal) return avisar("Elige de 1 a 5 estrellas.");
  const texto = val("texto");
  if(texto.length < 4) return avisar("Escribe unas palabras sobre tu experiencia.");
  const ya = D.resenas.find(r => r.negocio === id && r.usuario === u.id);
  if(ya){ ya.cal = cal; ya.texto = texto; }
  else D.resenas.push({id:D.siguiente.resena++, negocio:id, usuario:u.id, cal, texto,
    respuesta:"", estado:"publicada", fecha:new Date().toISOString().slice(0,10)});
  guardar(); pintar(); avisar(ya ? "Actualizamos tu reseña." : "Publicamos tu reseña. Gracias.");
}
function borrarResena(id){ D.resenas = D.resenas.filter(r => r.id !== id); guardar(); pintar(); avisar("Borramos tu reseña."); }
function responder(id){
  const t = $("resp"+id).value.trim();
  if(!t) return avisar("Escribe tu respuesta.");
  D.resenas.find(x => x.id === id).respuesta = t;
  guardar(); pintar(); avisar("Publicamos tu respuesta.");
}
function alternarFavorito(id){
  const u = yo(); if(!u) return;
  const i = D.favoritos.findIndex(f => f.usuario === u.id && f.negocio === id);
  if(i >= 0){ D.favoritos.splice(i,1); avisar("Lo quitamos de tus favoritos."); }
  else { D.favoritos.push({usuario:u.id, negocio:id}); avisar("Lo guardamos en tus favoritos."); }
  guardar(); pintar();
}

function pintarSub(){
  const c = CATEGORIAS.find(x => x.id === val("g_categoria"));
  subSeleccionadas = [];
  $("g_sub").innerHTML = c
    ? c.sub.map(s => '<button type="button" class="chip" data-sub="' + esc(s) +
        '" onclick="alternarSub(this)">' + esc(s) + "</button>").join("")
    : '<span class="pequeno apagado">Primero elige una categoría principal.</span>';
}

function alternarSub(btn){
  const s = btn.dataset.sub;
  const i = subSeleccionadas.indexOf(s);
  if(i >= 0){ subSeleccionadas.splice(i,1); btn.classList.remove("rosa"); }
  else {
    if(subSeleccionadas.length >= MAX_SUBCATEGORIAS)
      return avisar("Puedes elegir hasta " + MAX_SUBCATEGORIAS + " subcategorías.");
    subSeleccionadas.push(s); btn.classList.add("rosa");
  }
}

function enviarRegistro(planId){
  const plan = PLANES[planId], P = plan.permisos;
  const decir = m => { if($("g_error")) $("g_error").textContent = m; avisar(m); };

  const nombre = val("g_nombre"), correo = val("g_correo").toLowerCase(), clave = val("g_clave");
  if(nombre.length < 2) return decir("Escribe tu nombre.");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(correo)) return decir("Ese correo no parece válido.");
  if(clave.length < 8) return decir("La contraseña necesita al menos 8 caracteres.");
  if(D.usuarios.some(u => u.correo.toLowerCase() === correo))
    return decir("Ya existe una cuenta con ese correo. Entra con tu contraseña.");

  const negocio = val("g_negocio");
  if(!negocio) return decir("Escribe el nombre de tu negocio.");
  const categoria = val("g_categoria");
  if(!categoria) return decir("Elige la categoría principal de tu negocio.");
  if(!subSeleccionadas.length) return decir("Elige al menos una subcategoría.");
  const descripcion = val("g_descripcion");
  if(descripcion.length < 20) return decir("Cuéntanos un poco más de tu negocio (mínimo 20 caracteres).");

  const u = {id:D.siguiente.usuario++, nombre, correo, clave, rol:"negocio", estado:"activo",
    telefono:val("g_telefono")};
  D.usuarios.push(u);

  const id = D.siguiente.negocio++;
  const esPago = plan.precio > 0;
  D.negocios.push({
    id, duena:u.id, nombre:negocio, slug:slugificar(negocio), categoria,
    sub:subSeleccionadas.slice(), ciudad:val("g_ciudad"), direccion:val("g_direccion"),
    descripcion, telefono:val("g_telefono"), logo:null, fotos:[], productos:[], publicaciones:[],
    redes:{ whatsapp:  P.redes ? val("g_whatsapp")  : "",
            instagram: P.redes ? val("g_instagram") : "",
            facebook:  P.redes ? val("g_facebook")  : "",
            tiktok:    P.redes ? val("g_tiktok")    : "" },
    plan:planId, vence: esPago ? new Date(Date.now()+30*864e5).toISOString().slice(0,10) : null,
    pagoConfirmado: !esPago, estado:"pendiente", verificado:false,
    vistas:0, nota:""
  });

  // La solicitud queda registrada para el equipo y para exportar a la hoja de cálculo.
  D.solicitudes.push({
    id:D.siguiente.solicitud++, tipo:planId, plan:plan.nombre, precio:plan.precio,
    nombre, correo, telefono:val("g_telefono"), negocio, ciudad:val("g_ciudad"),
    categoria:cat(categoria).nombre, subcategorias:subSeleccionadas.join(" | "),
    descripcion, mensaje: val("g_mensaje"), estado:"nueva", fecha:new Date().toISOString()
  });

  D.sesion = u.id;
  anotar("Registro recibido", negocio + " — plan " + plan.nombre);
  guardar();
  location.hash = "#/panel"; pintar();
  avisar(esPago
    ? "Recibimos tu registro. MÍA te contacta para confirmar tu pago."
    : "¡Listo! Tu perfil quedó en espera de revisión.");
}

function fichaPanel(n){
  const r = reglas(n), av = bloqueos(n);
  const pubsVisibles = publico(n).publicaciones.length, pubsTotal = (n.publicaciones||[]).length;
  return '<div class="tarjeta p20 pila g12">' +
    '<div class="fila entre g12 arriba">' +
      '<div class="fila g12" style="flex:1;min-width:220px">' + logoHtml(n) +
        '<div class="pila g4">' +
          '<div class="fila g8">' +
            '<span class="chip ' + ESTADOS[n.estado].chip + '">' + esc(ESTADOS[n.estado].et) + "</span>" +
            '<span class="chip ' + (r.efectivo !== r.contratado ? "peligro" : "cobalto") + '">' +
              esc(PLANES[r.contratado].nombre) +
              (r.vencida ? " · vencido" : r.sinPago ? " · sin confirmar" : "") + "</span>" +
            (n.verificado && r.permisos.verificado ? '<span class="chip jade">Verificado</span>' : "") +
          "</div>" +
          "<h3>" + esc(n.nombre) + "</h3>" +
          '<p class="diminuto apagado">' + esc(cat(n.categoria).nombre) +
            ((n.sub||[]).length ? " · " + esc(n.sub.join(", ")) : "") + "</p>" +
        "</div></div>" +
      '<div class="fila g8">' +
        '<button class="btn linea chico" onclick="location.hash=\'#/editar/' + n.id + '\'">Editar perfil</button>' +
        (n.estado === "publicado" ? '<a class="btn fantasma chico" href="#/negocio/' +
          esc(n.slug) + '">Ver perfil</a>' : "") +
      "</div></div>" +

    (n.estado === "borrador" ? '<div class="aviso">Este perfil todavía no lo ve nadie.' +
      '<button class="btn chico" style="margin-left:auto" onclick="mandarRevision(' + n.id +
      ')">Mandar a revisión</button></div>' : "") +
    (n.estado === "rechazado" && n.nota ? '<div class="aviso alerta"><div>' +
      "<strong>MÍA pidió cambios:</strong> " + esc(n.nota) +
      '<br><button class="btn chico" style="margin-top:8px" onclick="mandarRevision(' + n.id +
      ')">Volver a mandar</button></div></div>' : "") +
    (n.estado === "pendiente" ? '<div class="aviso">MÍA está revisando este perfil. ' +
      "Te avisamos en cuanto se publique.</div>" : "") +
    (n.estado === "suspendido" ? '<div class="aviso alerta">MÍA detuvo este perfil' +
      (n.nota ? ": " + esc(n.nota) : ".") + "</div>" : "") +

    (av.length ? '<div class="aviso candado"><div><strong>Tu plan está ocultando cosas:</strong>' +
      '<ul style="margin:6px 0 0;padding-left:18px">' + av.map(x => "<li>" + esc(x) + "</li>").join("") +
      '</ul><a class="btn chico" style="margin-top:9px" href="#/planes">Ver planes</a></div></div>' : "") +

    (r.permisos.estadisticas
      ? '<div class="metricas">' + metrica(n.vistas,"Visitas") +
        metrica(D.favoritos.filter(f => f.negocio === n.id).length,"Favoritos","cobalto") +
        metrica(resenasDe(n.id,false).length,"Reseñas","jade") +
        metrica(promedio(n.id) ? promedio(n.id).toFixed(1) : "—","Calificación","sol") +
        metrica(pubsVisibles + (pubsTotal > pubsVisibles ? " / " + pubsTotal : ""),"Publicaciones") +
        "</div>"
      : '<p class="diminuto apagado">Las estadísticas de tu perfil empiezan en el plan Membresía.</p>') +
  "</div>";
}

const metrica = (v,et,tono) => '<div class="metrica ' + (tono||"") + '"><div class="n">' +
  esc(v) + '</div><div class="et">' + esc(et) + "</div></div>";

function mandarRevision(id){
  const n = negocioPorId(id);
  if(!n.nombre.trim()) return avisar("Ponle nombre a tu negocio.");
  if(!(n.descripcion||"").trim()) return avisar("Escribe de qué se trata tu negocio.");
  if(!n.categoria) return avisar("Elige la categoría principal.");
  n.estado = "pendiente"; n.nota = "";
  anotar("Perfil enviado a revisión", n.nombre);
  guardar(); pintar(); avisar("Lo mandamos a revisión. MÍA te avisa cuando se publique.");
}

function guardarNegocio(id){
  const n = negocioPorId(id), P = reglas(n).permisos;
  const nombre = val("f_nombre");
  if(!nombre) return avisar("El negocio necesita un nombre.");
  if(nombre !== n.nombre){ n.nombre = nombre; n.slug = slugificar(nombre); }
  n.ciudad = val("f_ciudad");
  n.direccion = val("f_direccion");
  n.telefono = val("f_telefono");
  n.descripcion = val("f_descripcion");
  // Los campos bloqueados no se sobrescriben: lo capturado con un plan mayor se conserva.
  if(P.redes){
    n.redes = {whatsapp:val("f_whatsapp"), instagram:val("f_instagram"),
      facebook:val("f_facebook"), tiktok:val("f_tiktok")};
  }
  guardar(); pintar(); avisar("Guardamos los cambios.");
}

function cambiarCategoria(id, cid){
  const n = negocioPorId(id);
  n.categoria = cid;
  n.sub = [];                    // Las subcategorías pertenecen a la categoría anterior.
  guardar(); pintar();
  avisar("Cambiaste de categoría. Vuelve a elegir tus subcategorías.");
}

function alternarSubNegocio(id, s){
  const n = negocioPorId(id);
  n.sub = n.sub || [];
  const i = n.sub.indexOf(s);
  if(i >= 0) n.sub.splice(i,1);
  else {
    if(n.sub.length >= MAX_SUBCATEGORIAS)
      return avisar("Puedes elegir hasta " + MAX_SUBCATEGORIAS + " subcategorías.");
    n.sub.push(s);
  }
  guardar(); pintar();
}

/* --------------------------------------------------------------- imágenes */
function procesarImagen(input, maxLado, calidad, alGuardar){
  const archivo = input.files && input.files[0];
  if(!archivo) return;
  const lector = new FileReader();
  lector.onload = ev => {
    const img = new Image();
    img.onload = () => {
      let {width:w, height:h} = img;
      if(w > maxLado || h > maxLado){ const k = Math.min(maxLado/w, maxLado/h);
        w = Math.round(w*k); h = Math.round(h*k); }
      const lienzo = document.createElement("canvas");
      lienzo.width = w; lienzo.height = h;
      lienzo.getContext("2d").drawImage(img,0,0,w,h);
      alGuardar(lienzo.toDataURL("image/jpeg", calidad));
    };
    img.onerror = () => avisar("No pudimos leer esa imagen. Intenta con otra.");
    img.src = ev.target.result;
  };
  lector.readAsDataURL(archivo);
}

function subirFoto(id, input){
  const n = negocioPorId(id);
  procesarImagen(input, 900, 0.72, url => {
    n.fotos = n.fotos || [];
    n.fotos.push(url);
    if(guardar()){ pintar(); avisar("Subimos tu fotografía."); }
    else { n.fotos.pop(); pintar(); }
  });
}
function subirLogo(id, input){
  const n = negocioPorId(id);
  procesarImagen(input, 320, 0.8, url => {
    const antes = n.logo;
    n.logo = url;
    if(guardar()){ pintar(); avisar("Actualizamos tu logo."); }
    else { n.logo = antes; pintar(); }
  });
}
function quitarLogo(id){ negocioPorId(id).logo = null; guardar(); pintar(); avisar("Quitamos el logo."); }
function quitarFoto(id,i){ negocioPorId(id).fotos.splice(i,1); guardar(); pintar(); avisar("Quitamos la fotografía."); }

/* ---------------------------------------------------------- publicaciones */
function agregarPublicacion(id){
  const n = negocioPorId(id);
  const titulo = val("pu_titulo"), texto = val("pu_texto");
  if(!titulo) return avisar("Ponle título a tu publicación.");
  if(texto.length < 10) return avisar("Escribe un poco más en tu publicación.");
  n.publicaciones = n.publicaciones || [];
  n.publicaciones.push({id:Date.now(), titulo, texto,
    fecha:new Date().toISOString().slice(0,10), destacada:false});
  guardar(); pintar();
  const L = reglas(n).limites.publicaciones;
  avisar(L !== Infinity && n.publicaciones.length > L
    ? "Publicamos, pero tu plan muestra solo " + L + ". Las más recientes se ocultan."
    : "Publicamos tu novedad.");
}
function quitarPublicacion(id, pid){
  const n = negocioPorId(id);
  n.publicaciones = n.publicaciones.filter(p => p.id !== pid);
  guardar(); pintar(); avisar("Borramos la publicación.");
}
function alternarDestacada(id, pid){
  const n = negocioPorId(id), p = n.publicaciones.find(x => x.id === pid);
  p.destacada = !p.destacada; guardar(); pintar();
  avisar(p.destacada ? "Quedó destacada." : "Le quitamos lo destacado.");
}

/* -------------------------------------------------------------- productos */
function agregarProducto(id){
  const n = negocioPorId(id);
  const nombre = val("p_nombre");
  if(!nombre) return avisar("Escribe el nombre del producto.");
  n.productos = n.productos || [];
  n.productos.push({id:Date.now(), nombre,
    precio: val("p_precio") ? Number(val("p_precio")) : null,
    desc: val("p_desc"), destacado:false});
  guardar(); pintar(); avisar("Agregamos el producto.");
}
function quitarProducto(id,i){ negocioPorId(id).productos.splice(i,1); guardar(); pintar(); avisar("Quitamos el producto."); }
function alternarDestacado(id,i){
  const n = negocioPorId(id);
  n.productos[i].destacado = !n.productos[i].destacado;
  guardar(); pintar();
  avisar(n.productos[i].destacado ? "Producto destacado." : "Le quitamos lo destacado.");
}

const COLUMNAS = [["fecha","Fecha"],["plan","Plan"],["nombre","Nombre"],["correo","Correo"],
  ["telefono","Teléfono"],["negocio","Negocio"],["ciudad","Ciudad"],["categoria","Categoría"],
  ["subcategorias","Subcategorías"],["descripcion","Descripción"],["mensaje","Mensaje"],
  ["estado","Estado"]];

function armarCsv(){
  const celda = v => {
    const t = String(v ?? "").replace(/"/g,'""');
    return /[",\n]/.test(t) ? '"' + t + '"' : t;
  };
  const lineas = [COLUMNAS.map(c => celda(c[1])).join(",")];
  for(const s of D.solicitudes){
    lineas.push(COLUMNAS.map(([k]) => celda(
      k === "fecha" ? new Date(s.fecha).toLocaleString("es-MX") : s[k])).join(","));
  }
  return "﻿" + lineas.join("\r\n");   // BOM para que Sheets respete los acentos
}

async function exportarSolicitudes(){
  if(!D.solicitudes.length) return avisar("Todavía no hay solicitudes que descargar.");
  const csv = armarCsv();
  const hoy = new Date().toISOString().slice(0,10);
  if(!window.claude || !window.claude.downloads){
    verCsv(); return avisar("Aquí no puedo descargar archivos. Te dejo el contenido para copiar.");
  }
  try {
    await window.claude.downloads.save({filename:"solicitudes-mia-" + hoy + ".csv", data:csv});
    avisar("Listo. En Google Sheets: Archivo › Importar › Subir.");
  } catch(e){
    if(e && e.code === "extension_not_enabled"){
      try {
        await window.claude.downloads.save({filename:"solicitudes-mia-" + hoy + ".txt", data:csv});
        return avisar("Lo descargué como .txt. Google Sheets lo importa igual: Archivo › Importar.");
      } catch(e2){ return manejarFalloDescarga(e2); }
    }
    manejarFalloDescarga(e);
  }
}

function manejarFalloDescarga(e){
  const code = e && e.code;
  if(code === "declined") return avisar("Cancelaste la descarga.");
  if(code === "rate_limited") return avisar("Espera un momento y vuelve a intentar.");
  verCsv();
  avisar("No pude descargarlo. Te dejo el contenido para que lo copies.");
}

function verCsv(){
  const caja = $("csv_caja"); if(!caja) return;
  if(!D.solicitudes.length) return avisar("Todavía no hay solicitudes.");
  caja.innerHTML = '<div class="tarjeta p20 pila g12"><p class="eyebrow">Contenido para tu hoja</p>' +
    '<p class="pequeno apagado">Cópialo y pégalo en Google Sheets, luego usa ' +
    "Datos › Dividir el texto en columnas.</p>" +
    '<textarea readonly style="min-height:180px;font-family:var(--mono);font-size:.8rem">' +
    esc(armarCsv().replace(/^﻿/,"")) + "</textarea>" +
    '<div><button class="btn linea chico" onclick="copiarCsv(this)">Copiar todo</button></div></div>';
  caja.scrollIntoView({behavior:"smooth", block:"nearest"});
}

function copiarCsv(btn){
  const ta = btn.closest(".tarjeta").querySelector("textarea");
  ta.select(); ta.setSelectionRange(0, 999999);
  try { document.execCommand("copy"); avisar("Copiado. Pégalo en tu hoja."); }
  catch { avisar("Selecciona el texto y cópialo con Ctrl+C."); }
}

/* --------------------------------------------------------------- negocios */
function adminNegocios(){
  const filas = D.negocios.slice()
    .sort((a,b) => (b.estado === "pendiente") - (a.estado === "pendiente")).map(n => {
    const r = reglas(n);
    return '<tr><td><div class="fila g8">' + logoHtml(n) + "<div><strong>" + esc(n.nombre) +
        '</strong><br><span class="diminuto apagado">' + esc(usuarioPorId(n.duena)?.nombre || "—") +
        " · " + esc(n.ciudad || "sin ciudad") + '</span><br><span class="diminuto apagado">' +
        esc(cat(n.categoria).nombre) + "</span></div></div></td>" +
      '<td><span class="chip ' + ESTADOS[n.estado].chip + '">' + esc(ESTADOS[n.estado].et) + "</span></td>" +
      '<td><select onchange="adminPlan(' + n.id + ',this.value)" style="min-width:126px">' +
        ORDEN_PLANES.map(k => '<option value="' + k + '"' + (n.plan === k ? " selected" : "") + ">" +
          esc(PLANES[k].nombre) + "</option>").join("") + "</select>" +
        (r.vencida ? '<br><span class="chip peligro" style="margin-top:4px">Vencido</span>' : "") +
        (r.sinPago ? '<br><button class="btn chico" style="margin-top:4px" onclick="confirmarPago(' +
          n.id + ')">Confirmar pago</button>' : "") + "</td>" +
      '<td class="mono">' + n.vistas + "</td>" +
      '<td><div class="fila g8">' +
        (n.estado === "pendiente"
          ? '<button class="btn chico" onclick="adminAprobar(' + n.id + ')">Publicar</button>' +
            '<button class="btn linea chico" onclick="adminRechazar(' + n.id + ')">Pedir cambios</button>' : "") +
        (n.estado === "publicado"
          ? '<button class="btn linea chico" onclick="adminVerificar(' + n.id + ')">' +
            (n.verificado ? "Quitar verificado" : "Verificar") + "</button>" +
            '<button class="btn peligro chico" onclick="adminSuspender(' + n.id + ')">Suspender</button>' : "") +
        (n.estado === "suspendido"
          ? '<button class="btn chico" onclick="adminAprobar(' + n.id + ')">Reactivar</button>' : "") +
        '<button class="btn fantasma chico" onclick="location.hash=\'#/editar/' + n.id +
          '\'">Editar</button></div></td></tr>';
  }).join("");

  return encabezado("Negocios",
    "Publica los perfiles que esperan, confirma pagos, cambia planes, verifica o detén perfiles.") +
    '<div class="tabla-envoltura"><table><thead><tr><th>Negocio</th><th>Estado</th><th>Plan</th>' +
    "<th>Visitas</th><th>Acciones</th></tr></thead><tbody>" + filas + "</tbody></table></div>";
}

function adminAprobar(id){
  const n = negocioPorId(id);
  n.estado = "publicado"; n.nota = "";
  anotar("Perfil publicado", n.nombre); guardar(); pintar();
  avisar(n.nombre + " quedó publicado.");
}
function adminRechazar(id){
  const n = negocioPorId(id);
  const nota = prompt("¿Qué necesita corregir " + n.nombre + "?", "Falta una descripción más completa.");
  if(nota === null) return;
  n.estado = "rechazado"; n.nota = nota;
  anotar("Cambios solicitados", n.nombre + ": " + nota); guardar(); pintar();
  avisar("Le pedimos cambios a " + n.nombre + ".");
}
function adminSuspender(id){
  const n = negocioPorId(id);
  const nota = prompt("Motivo de la suspensión de " + n.nombre + ":", "Información falsa en el perfil.");
  if(nota === null) return;
  n.estado = "suspendido"; n.nota = nota;
  anotar("Perfil suspendido", n.nombre + ": " + nota); guardar(); pintar();
  avisar("Suspendimos " + n.nombre + ".");
}
function adminVerificar(id){
  const n = negocioPorId(id);
  n.verificado = !n.verificado;
  anotar(n.verificado ? "Perfil verificado" : "Verificación retirada", n.nombre);
  guardar(); pintar();
  avisar(n.verificado
    ? (reglas(n).permisos.verificado ? "Verificamos " + n.nombre + "."
      : "Quedó verificado, pero la insignia solo se muestra con Membresía.")
    : "Le quitamos la verificación.");
}
function adminPlan(id, plan){
  const n = negocioPorId(id);
  n.plan = plan;
  n.vence = plan === "gratuito" ? null : new Date(Date.now()+30*864e5).toISOString().slice(0,10);
  n.pagoConfirmado = true;
  anotar("Plan cambiado", n.nombre + " → " + PLANES[plan].nombre);
  guardar(); pintar(); avisar(n.nombre + " ahora tiene " + PLANES[plan].nombre + ".");
}
function confirmarPago(id){
  const n = negocioPorId(id);
  n.pagoConfirmado = true;
  n.vence = new Date(Date.now()+30*864e5).toISOString().slice(0,10);
  anotar("Pago confirmado", n.nombre + " — " + PLANES[n.plan].nombre);
  guardar(); pintar(); avisar("Confirmamos el pago. Ya tiene todos sus beneficios.");
}

/* --------------------------------------------------------------- usuarias */
function adminUsuarias(){
  const rolEt = {admin:"Organización MÍA", negocio:"Negocio", usuario:"Clienta"};
  const filas = D.usuarios.map(u => {
    const suyos = D.negocios.filter(n => n.duena === u.id).length, esYo = u.id === D.sesion;
    return "<tr><td><strong>" + esc(u.nombre) + '</strong><br><span class="diminuto apagado mono">' +
        esc(u.correo) + "</span></td>" +
      '<td><select onchange="adminRol(' + u.id + ',this.value)"' + (esYo ? " disabled" : "") +
        ' style="min-width:150px">' + Object.entries(rolEt).map(([k,t]) => '<option value="' + k + '"' +
          (u.rol === k ? " selected" : "") + ">" + esc(t) + "</option>").join("") + "</select></td>" +
      '<td><span class="chip ' + (u.estado === "activo" ? "jade" : "peligro") + '">' +
        (u.estado === "activo" ? "Activa" : "Suspendida") + "</span></td>" +
      '<td class="mono">' + suyos + "</td>" +
      "<td>" + (esYo ? '<span class="diminuto apagado">Eres tú</span>'
        : '<button class="btn ' + (u.estado === "activo" ? "peligro" : "") +
          ' chico" onclick="adminSuspenderUsuaria(' + u.id + ')">' +
          (u.estado === "activo" ? "Suspender" : "Reactivar") + "</button>") + "</td></tr>";
  }).join("");
  return encabezado("Usuarias",
    "Cambia el tipo de cuenta o suspende el acceso. Al suspender, su sesión deja de servir de inmediato.") +
    '<div class="tabla-envoltura"><table><thead><tr><th>Persona</th><th>Tipo de cuenta</th>' +
    "<th>Estado</th><th>Perfiles</th><th>Acción</th></tr></thead><tbody>" + filas + "</tbody></table></div>";
}
function adminRol(id, rol){
  const u = usuarioPorId(id);
  u.rol = rol; anotar("Tipo de cuenta cambiado", u.nombre + " → " + rol);
  guardar(); pintar(); avisar("Actualizamos el tipo de cuenta de " + u.nombre + ".");
}
function adminSuspenderUsuaria(id){
  const u = usuarioPorId(id);
  u.estado = u.estado === "activo" ? "suspendido" : "activo";
  anotar(u.estado === "activo" ? "Cuenta reactivada" : "Cuenta suspendida", u.nombre);
  guardar(); pintar();
  avisar(u.estado === "activo" ? "Reactivamos a " + u.nombre + "." : "Suspendimos a " + u.nombre + ".");
}

/* ---------------------------------------------------------------- reseñas */

  const filas = D.resenas.slice().reverse().map(r => {
    const n = negocioPorId(r.negocio), a = usuarioPorId(r.usuario);
    return "<tr><td>" + estrellasHtml(r.cal) + '<p class="pequeno" style="margin-top:4px">' +

        (r.estado === "publicada" ? "Publicada" : "Oculta") + "</span></td>" +
      '<td><button class="btn ' + (r.estado === "publicada" ? "peligro" : "") +

function adminOcultar(id){

  anotar(r.estado === "oculta" ? "Reseña ocultada" : "Reseña restituida", negocioPorId(r.negocio)?.nombre || "");

/* ------------------------------------------------------------------- blog */
function adminBlog(){
  return encabezado("Blog", "Escribe y publica los artículos de MÍA.") +
    '<div class="tarjeta p20 pila g12"><p class="eyebrow">Nuevo artículo</p>' +
      '<label class="campo">Título<input id="b_titulo"></label>' +
      '<label class="campo">Resumen<input id="b_resumen" placeholder="Una línea que invite a leer."></label>' +
      '<label class="campo">Contenido <span class="apagado">(deja una línea en blanco entre párrafos)</span>' +
        '<textarea id="b_cuerpo" style="min-height:170px"></textarea></label>' +
      '<div><button class="btn" onclick="crearArticulo()">Publicar artículo</button></div></div>' +
    (D.articulos.length ? '<div class="pila g12">' + D.articulos.slice()
      .sort((a,b) => String(b.fecha).localeCompare(a.fecha)).map(a =>
      '<div class="tarjeta p16 fila entre g8"><div style="flex:1;min-width:180px">' +
        '<div class="fila g8"><span class="chip ' + (a.publicado ? "jade" : "sol") + '">' +
        (a.publicado ? "Publicado" : "Borrador") + '</span><span class="diminuto apagado">' +
        esc(fecha(a.fecha)) + "</span></div>" +
        "<strong>" + esc(a.titulo) + '</strong><p class="diminuto apagado">' + esc(a.resumen) + "</p></div>" +
        '<div class="fila g8"><a class="btn fantasma chico" href="#/blog/' + esc(a.slug) + '">Ver</a>' +
        '<button class="btn linea chico" onclick="alternarArticulo(' + a.id + ')">' +
        (a.publicado ? "Ocultar" : "Publicar") + "</button>" +
        '<button class="btn fantasma chico" onclick="borrarArticulo(' + a.id + ')">Borrar</button></div></div>'
      ).join("") + "</div>" : vacio("Todavía no hay artículos."));
}

function crearArticulo(){
  const titulo = val("b_titulo"), resumen = val("b_resumen"), cuerpo = val("b_cuerpo");
  if(!titulo) return avisar("Ponle título al artículo.");
  if(cuerpo.length < 40) return avisar("Escribe un poco más de contenido.");
  const base = titulo.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60) || "articulo";
  let slug = base, i = 2;
  while(D.articulos.some(a => a.slug === slug)) slug = base + "-" + (i++);
  D.articulos.push({id:D.siguiente.articulo++, slug, titulo,
    resumen: resumen || cuerpo.slice(0,120), cuerpo,
    autora:"Equipo MÍA", fecha:new Date().toISOString().slice(0,10), publicado:true});
  anotar("Artículo publicado", titulo);
  guardar(); pintar(); avisar("Publicamos el artículo.");
}
function alternarArticulo(id){
  const a = D.articulos.find(x => x.id === id);
  a.publicado = !a.publicado;
  anotar(a.publicado ? "Artículo publicado" : "Artículo ocultado", a.titulo);
  guardar(); pintar();
}
function borrarArticulo(id){
  const a = D.articulos.find(x => x.id === id);
  if(!confirm("¿Borrar el artículo “" + a.titulo + "”?")) return;
  D.articulos = D.articulos.filter(x => x.id !== id);
  anotar("Artículo borrado", a.titulo);
  guardar(); pintar(); avisar("Borramos el artículo.");
}

function adminBitacora(){
  return encabezado("Bitácora", "Queda registro de cada acción administrativa.") +
    (D.bitacora.length
      ? '<div class="tabla-envoltura"><table><thead><tr><th>Cuándo</th><th>Quién</th><th>Acción</th>' +
        "<th>Detalle</th></tr></thead><tbody>" + D.bitacora.map(b =>

        "<td><strong>" + esc(b.accion) + '</strong></td><td class="pequeno apagado">' +
        esc(b.detalle) + "</td></tr>").join("") + "</tbody></table></div>"
      : vacio("Todavía no hay movimientos. Publica o suspende un perfil y aparecerá aquí."));
}

/* ================================================================= ARRANQUE */
let ultimaVista = null;
window.addEventListener("hashchange", () => {
  const {vista, arg} = ruta();
  if(vista === "negocio" && arg !== ultimaVista){
    const n = D.negocios.find(x => x.slug === arg);
    if(n && n.estado === "publicado"){ n.vistas++; guardar(); }
    ultimaVista = arg;
  }
  pintar();
});

pintar();
